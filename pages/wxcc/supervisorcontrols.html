<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <title>WxCC — Supervisor Portal</title>
    <link rel="stylesheet" href="../../assets/css/theme.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="../../assets/images/Orbit_Icon-192.png">
    <style>
        main {
            padding: 32px 0 80px;
            width: 100%;
            margin: 0 auto;
            display: flex;
            justify-content: flex-start;
        }

        .grid {
            display: grid;
            gap: 16px;
        }
        .supervisorShell {
            width: 100%;
        }
        global-variable-manager {
            display: block;
            min-height: 420px;
        }
    </style>
  <script src="../../assets/js/orbit-config.js"></script>
  </head>
<body class="dark-mode">
  <script>if (localStorage.getItem("tpRailExpanded") === "true") document.body.classList.add("tp-rail-expanded");</script>
  <api-tools-header basepath="../../"></api-tools-header>
  <main>
    <div class="wrap wide contentWrap">
      <section class="card">
        <div class="pageHeader">
          <h1>Supervisor Controls</h1>
          <p class="lead">View and manage supervisor variables in your org.</p>
        </div>
        <div class="grid">
          <div class="supervisorShell">
            <global-variable-manager id="gvm" theme="dark"></global-variable-manager>
          </div>
        </div>
      </section>
    </div>
  </main>

    <script src="../../assets/js/components.js"></script>
  <script src="../../assets/js/theme.js"></script>
<script src="https://cxasteam.bitbucket.io/WxCC_Desktop_Layout_Tools/SupervisorControls.js"></script>
  <script>
    const cacheKeyBearer = 'authBearer';
    const cacheKeyOrg = 'authOrg';
    const cacheKeyOrgName = 'authOrgName';
    const cacheKeyUser = 'authUserName';

    const gvmEl = document.getElementById('gvm');

    function getOrgIdValue() {
      const cached = localStorage.getItem('authOrgId') || '';
      if (cached) {
        if (/^Y2lz/i.test(cached)) {
          try {
            const padded = cached.replace(/-/g, '+').replace(/_/g, '/').padEnd(Math.ceil(cached.length / 4) * 4, '=');
            const decoded = atob(padded);
            const parts = decoded.split('/');
            const result = parts[parts.length - 1] || decoded;
            localStorage.setItem('authOrgId', result);
            return result;
          } catch {
            return cached;
          }
        }
        const orgPathIdx = cached.toLowerCase().indexOf('organization/');
        if (orgPathIdx !== -1) {
          const candidate = cached.slice(orgPathIdx + 'organization/'.length);
          if (candidate) {
            localStorage.setItem('authOrgId', candidate);
            return candidate;
          }
        }
        return cached;
      }
      const raw = localStorage.getItem(cacheKeyOrg) || '';
      if (!raw) return '';

      if (/^Y2lz/i.test(raw)) {
        try {
          const padded = raw.replace(/-/g, '+').replace(/_/g, '/').padEnd(Math.ceil(raw.length / 4) * 4, '=');
          const decoded = atob(padded);
          const parts = decoded.split('/');
          return parts[parts.length - 1] || decoded;
        } catch {
          return raw;
        }
      }

      const orgPathIdx = raw.toLowerCase().indexOf('organization/');
      if (orgPathIdx !== -1) {
        const candidate = raw.slice(orgPathIdx + 'organization/'.length);
        return candidate || raw;
      }

      return raw;
    }

    function getDataCenter() {
      const params = new URLSearchParams(window.location.search);
      return params.get('dc') || 'us1';
    }

    function setupSupervisorControls() {
      if (!gvmEl) return;
      const token = (localStorage.getItem(cacheKeyBearer) || '').trim();
      const orgId = getOrgIdValue();
      const dataCenter = getDataCenter();

      gvmEl.setAttribute('token', token);
      gvmEl.setAttribute('org-id', orgId);
      gvmEl.setAttribute('data-center', dataCenter);
      gvmEl.setAttribute('theme', 'dark');
    }

    // Auth modal (shared pattern)
    (function initAuthModal(){
      if (document.getElementById('authModal')) return;
      const style = document.createElement('style');
      style.textContent = `
        .authModalOverlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:9999;padding:16px;}
        .authModalOverlay.open{display:flex;}
        .authCard{width:100%;max-width:520px;background:#131a2a;border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:18px;box-shadow:0 18px 36px rgba(0,0,0,.45);position:relative;}
        .authCard h2{margin:0 0 8px;font-size:1.2rem;}
        .authCard p{margin:0 0 12px;color:#92a0b8;line-height:1.4;}
        .authCard label{display:block;font-size:13px;color:#92a0b8;margin:10px 0 6px;}
        .authCard input{width:100%;border-radius:12px;border:1px solid rgba(255,255,255,.08);background:#0e1525;color:#e9edf5;padding:10px 12px;font-size:14px;}
        .authCard input:focus{outline:none;box-shadow:0 0 0 3px rgba(59,130,246,.25);}
        .authCard .actions{display:flex;gap:10px;justify-content:flex-end;margin-top:14px;}
        .authCard .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:9px 14px;border-radius:12px;font-weight:700;border:1px solid rgba(255,255,255,.08);background:#0e1525;color:#e9edf5;cursor:pointer;text-decoration:none;}
        .authCard .btn.primary{background:linear-gradient(135deg,#159DD8,#159DD8);color:#06111d;border:none;}
        .authClose{position:absolute;right:10px;top:10px;background:transparent;border:none;color:#92a0b8;font-size:18px;cursor:pointer;}
        .authStatus{margin-top:8px;font-size:13px;color:#92a0b8;}
        .authCard .btn.webex{background:#07C;color:white;border:none;padding:11px 20px;}
        .authCard .btn.webex:hover{background:#0069CC;}
        .authDivider{display:flex;align-items:center;gap:12px;margin:16px 0;color:#92a0b8;font-size:13px;}
        .authDivider::before,.authDivider::after{content:'';flex:1;height:1px;background:rgba(255,255,255,.08);}
      `;
      document.head.appendChild(style);

      const overlay = document.createElement('div');
      overlay.className = 'authModalOverlay';
      overlay.id = 'authModal';
      overlay.innerHTML = `
        <div class="authCard">
          <button class="authClose" aria-label="Close">×</button>
          <h2>Sign in with Webex</h2>
          <p>Click below to authenticate with your Webex account.</p>
          
          <button class="btn webex" id="authWebex" style="width:100%;">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
              <path d="M19.7 7.3c-1.2-1.2-2.7-2-4.5-2.3-.3-1.6-1.2-3-2.5-4-1.4-1-3-1.6-4.7-1.6-2.2 0-4.2.8-5.7 2.3C.8 3.2 0 5.2 0 7.4c0 1.7.6 3.3 1.6 4.7 1 1.3 2.4 2.2 4 2.5.3 1.6 1.2 3 2.5 4 1.5 1 3.1 1.6 4.9 1.6 2.2 0 4.2-.8 5.7-2.3 1.5-1.5 2.3-3.5 2.3-5.7 0-1.8-.6-3.4-1.6-4.7-.1 0-.2-.1-.2-.2zM13 18.4c-1.3 0-2.5-.4-3.5-1.2-.9-.7-1.6-1.7-2-2.8l5.5-2 2 5.5c-1.1.3-1.3.5-2 .5zM7.5 13l-5.3 1.9c-.1-.6-.2-1.2-.2-1.8 0-1.7.6-3.2 1.7-4.3C4.8 7.6 6.4 7 8 7c.6 0 1.2.1 1.8.2L7.5 13zm11.2 2.8c-1.1 1.1-2.6 1.7-4.2 1.7-.6 0-1.2-.1-1.8-.2l2.3-6.3 5.3-1.9c.1.6.2 1.2.2 1.8 0 1.6-.6 3.1-1.8 4.2v-.3zm-7-11.3c1.3 0 2.5.4 3.5 1.2.9.7 1.6 1.7 2 2.8l-5.5 2-2-5.5c.6-.3 1.3-.5 2-.5zM3.3 8.8C4.4 7.7 5.9 7.1 7.5 7.1c.6 0 1.2.1 1.8.2L7 13.6l-5.3 1.9c-.1-.6-.2-1.2-.2-1.8 0-1.7.6-3.2 1.8-4.3v-.6z"/>
            </svg>
            Sign in with Webex
          </button>
          
          <div class="authStatus" id="authStatus"></div>
        </div>
      `;
      document.body.appendChild(overlay);

      const CLIENT_ID = window.ORBIT_CLIENT_ID;
      const REDIRECT_URI = window.ORBIT_REDIRECT_URI || (window.location.origin + window.location.pathname.replace(/[^/]+$/, '../callback.html'));
      const SCOPES = window.ORBIT_OAUTH_SCOPES;

      const closeBtn = overlay.querySelector('.authClose');
      const webexBtn = overlay.querySelector('#authWebex');
      const KEYS = { bearer:'authBearer', org:'authOrg', orgName:'authOrgName' };

      webexBtn.addEventListener('click', () => {
        const authUrl = `https://webexapis.com/v1/authorize?client_id=${CLIENT_ID}&response_type=code&redirect_uri=${encodeURIComponent(REDIRECT_URI)}&scope=${encodeURIComponent(SCOPES)}&state=${Date.now()}&prompt=consent`;
        window.location.href = authUrl;
      });

      const close = () => overlay.classList.remove('open');
      closeBtn.addEventListener('click', close);
      overlay.addEventListener('click', (e) => { if (e.target === overlay) close(); });
      window.addEventListener('keydown', (e) => { if (e.key === 'Escape') close(); });

      window.addEventListener('load', () => {
        const bearer = localStorage.getItem(KEYS.bearer);
        const org = localStorage.getItem(KEYS.org);
        if (!bearer || !org) {
          overlay.classList.add('open');
        }
      });
    })();

    function updateAuthIndicators() {
      const b = localStorage.getItem(cacheKeyBearer) || '';
      const org = localStorage.getItem(cacheKeyOrgName) || localStorage.getItem(cacheKeyOrg) || '';
      const user = localStorage.getItem(cacheKeyUser) || '';
      const userNameEl = document.getElementById('userName');
      const userOrgEl = document.getElementById('userOrg');
      if (userNameEl) userNameEl.textContent = b ? (user || 'Authenticated') : 'Not authenticated';
      if (userOrgEl) userOrgEl.textContent = org || '';
    }

    const signOutBtn = document.getElementById('signOutBtn');
    if (signOutBtn) {
      signOutBtn.addEventListener('click', () => {
        localStorage.removeItem(cacheKeyBearer);
        localStorage.removeItem(cacheKeyOrg);
        localStorage.removeItem(cacheKeyOrgName);
        localStorage.removeItem(cacheKeyUser);
        localStorage.removeItem('authRefreshToken');
        localStorage.removeItem('authExpiresAt');
        window.location.href = '../../index.html';
      });
    }


    document.addEventListener('click', (event) => {
    });

    document.addEventListener('keydown', (event) => {
    });

    window.addEventListener('load', () => {
      updateAuthIndicators();
      setupSupervisorControls();
    });
    window.addEventListener('storage', (e) => {
      if (!e.key) return;
      if ([cacheKeyBearer, cacheKeyOrg, cacheKeyOrgName, cacheKeyUser].includes(e.key)) {
        updateAuthIndicators();
        setupSupervisorControls();
      }
    });
  </script>


  </body>
</html>
