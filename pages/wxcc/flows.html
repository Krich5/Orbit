    function mapVisualizerHandleId(sourceNode, link, fallbackLabel = '') {
      const rawHandleId = link?.interactionCondition || link?.name || link?.conditionExpr || link?.properties?.value || fallbackLabel || '';
      const config = getVisualizerNodeConfig(sourceNode?.properties?.activityName || sourceNode?.activityName || sourceNode?.group || '');
      const componentType = config.nodeType;
      const lowerName = String(rawHandleId).toLowerCase();
      const lowerLabel = String(link?.label || fallbackLabel || '').toLowerCase();
      const isErrorPath = ['error', 'failure', 'invalid', 'false', 'insufficient', 'busy', 'no_answer', 'exception'].some(token => lowerName.includes(token));
      const isTimeout = lowerName.includes('timeout');

      if (componentType === 'BusinessHoursNode') {
        if (lowerName.includes('open') || lowerName.includes('working') || lowerLabel.includes('open')) return 'workingHours';
        if (lowerName.includes('holiday') || lowerLabel.includes('holiday')) return 'holiday';
        if (lowerName.includes('force') || lowerName.includes('override') || lowerLabel.includes('override')) return 'override';
        if (isErrorPath && !lowerName.includes('false')) return 'error';
        return 'default';
      }

      if (componentType === 'ConditionNode') {
        if (lowerName === 'true' || lowerName === '1') return 'true';
        if (lowerName === 'false' || lowerName === '0') return 'false';
        if (isErrorPath) return 'error';
        return 'default';
      }

      if (isErrorPath) {
        if (lowerName.includes('busy')) return 'busy';
        if (lowerName.includes('no_answer')) return 'no_answer';
        if (lowerName.includes('invalid')) return 'invalid';
        if (lowerName.includes('insufficient')) return 'insufficient_data';
        if (lowerName.includes('failure')) return 'failure';
        return 'error';
      }

      if (isTimeout) return 'timeout';
      if (componentType === 'MenuNode' || componentType === 'CaseNode') return String(rawHandleId || 'default').trim() || 'default';
      return 'default';
    }

    function isVisualizerErrorHandle(handleId) {
      return ['error', 'failure', 'invalid', 'false', 'insufficient_data', 'busy', 'no_answer', 'exception', 'timeout'].includes(String(handleId || '').toLowerCase());
    }

    function buildPromptDisplayLines(props = {}) {
      const toItems = (list = []) => Array.isArray(list) ? list : [];
      const promptItems = [
        ...toItems(props.prompts),
        ...toItems(props.promptsTts),
      ];
      const lines = [];
      const seen = new Set();
      promptItems.forEach(item => {
        if (!item || typeof item !== 'object') return;
        const type = String(item.type || '').toLowerCase();
        const value = String(item.value || item.name || item.prompt || '').trim();
        if (!value) return;
        const label = type === 'tts'
          ? 'TTS'
          : ((type === 'audiofile' || /\.wav$/i.test(value)) ? 'Wav' : 'Prompt');
        const line = `${label}: ${value}`;
        if (seen.has(line)) return;
        seen.add(line);
        lines.push(line);
      });
      return lines;
    }

    function compactDiagramValue(value, maxLen = 120) {
      const cleaned = String(value || '').replace(/\s+/g, ' ').trim();
      if (!cleaned) return '';
      if (cleaned.length <= maxLen) return cleaned;
      return `${cleaned.slice(0, Math.max(0, maxLen - 3))}...`;
    }

    function compactJsonPreview(value, maxLen = 180) {
      const compact = compactDiagramValue(value, maxLen);
      if (!compact) return '';
      return compact;
    }

    function buildSetVariableLines(props = {}) {
      const lines = [];
      const seen = new Set();
      const pushLine = (target, value) => {
        const lhs = String(target || '').trim();
        const rhs = compactDiagramValue(value || '', 120);
        const line = lhs || rhs
          ? `${lhs || 'Variable'}${rhs ? ` = ${rhs}` : ''}`.trim()
          : '';
        if (!line || seen.has(line)) return;
        seen.add(line);
        if (lines.length) lines.push('');
        lines.push(line);
      };

      const arraysToCheck = [
        props?.setVariablesArray,
        props?.setVariableArray,
        props?.variables,
        props?.assignments,
      ];
      arraysToCheck.forEach(list => {
        if (!Array.isArray(list)) return;
        list.forEach(entry => {
          if (!entry || typeof entry !== 'object') return;
          const target = entry?.srcVariable || entry?.targetVariable || entry?.variable || entry?.name || entry?.key || '';
          const value = entry?.expr ?? entry?.expression ?? entry?.literal ?? entry?.value ?? entry?.literalValue ?? '';
          pushLine(target, value);
        });
      });

      pushLine(
        props?.srcVariable || props?.targetVariable || props?.variableName || props?.variable || '',
        props?.expr ?? props?.expression ?? props?.literal ?? props?.value ?? props?.literalValue ?? ''
      );

      Object.entries(props || {}).forEach(([key, value]) => {
        if (!/(^setVariable|^srcVariable$|^expr$|^literal$|^expression$|^variableName$)/i.test(key)) return;
        if (key === 'setVariablesArray' || key === 'setVariableArray') return;
        if (value && typeof value === 'object') return;
      });

      return lines;
    }

          }
          return cleaned;
        };
        const bodyLines = stripDuplicateLeadLines(lines.slice(1), [
          subtitle,
          config.label,
          subtitleLabelFor(activityName, node.group || ''),
        ]);
        const outputRows = buildOutputRows(node, summary);
        const adjustedWidth = DIAGRAM_NODE_WIDTH;
        const headerHeight = 42;
        const isChoiceNode = activityName === 'ivr-menu' || activityName === 'case-statement';
        const outputColumnWidth = outputRows.length
          ? Math.max(...outputRows.map(row => measureTextWidth(row?.text || '', 10) + 16))
          : 0;
        const reservedOutputWidth = isChoiceNode && outputRows.length
          ? Math.min(
              DIAGRAM_OUTPUT_COLUMN_MAX,
              Math.max(DIAGRAM_OUTPUT_COLUMN_MIN, outputColumnWidth + DIAGRAM_OUTPUT_COLUMN_GAP)
            )
          : 0;
        const contentWidth = Math.max(
          120,
          adjustedWidth - 36 - reservedOutputWidth - (isChoiceNode && reservedOutputWidth ? DIAGRAM_CHOICE_BODY_GUTTER : 0)
        );
        const wrapChars = Math.max(24, Math.floor(contentWidth / 7));
        const wrappedBodyLines = wrapBodyContentLines(
          bodyLines,
          ['HTTPRequestNode', 'BRERequestNode', 'SetVariableNode'].includes(config.nodeType)
            ? Math.max(wrapChars, 46)
            : wrapChars
        );
        const visibleBodyLines = wrappedBodyLines;
        const contentHeight = visibleBodyLines.length * 15 + 14;
        const outputHeight = outputRows.length ? (outputRows.length * 18 + 10) : 0;
        const height = Math.max(92, headerHeight + 18 + Math.max(contentHeight, outputHeight));
        const palette = nodePaletteFor(summary.meta || {}, node.group || '');
        return {
          id: node.id,
          type: activityName === 'newphonecontact' || String(node.group || '').toLowerCase() === 'start' ? 'StartNode' : 'Node',
          data: {
            title,
            subtitle,
            bodyLines: visibleBodyLines,
            outputRows,
            meta: summary.meta || {},
            palette,
            width: adjustedWidth,
            height,
            isStartNode: activityName === 'newphonecontact' || String(node.group || '').toLowerCase() === 'start',
            isEventNode: activityName === 'event',
          }
        };
      });

      const linkList = [...(links || [])];
      const getMenuOrder = (srcId, label) => {
        if (!srcId) return null;
        const summary = summaryById.get(srcId);
        const menuOptions = summary?.meta?.menuOptions || [];
        if (!menuOptions.length) return null;
        const key = String(label || '').trim();
        const match = menuOptions.find(item => item.key === key);
        return match ? match.order : null;
      };
      linkList.sort((a, b) => {
        const aSrc = a?.sourceActivityId || '';
        const bSrc = b?.sourceActivityId || '';
        if (aSrc !== bSrc) return aSrc.localeCompare(bSrc);
        const aLabel = a?.conditionExpr || a?.properties?.value || '';
        const bLabel = b?.conditionExpr || b?.properties?.value || '';
        const aOrder = getMenuOrder(aSrc, aLabel);
        const bOrder = getMenuOrder(bSrc, bLabel);
        if (aOrder == null && bOrder == null) return 0;
        if (aOrder == null) return 1;
        if (bOrder == null) return -1;
        return aOrder - bOrder;
      });

      linkList.forEach((link, idx) => {
        const src = link?.sourceActivityId;
        const tgt = link?.targetActivityId;
        if (!src || !tgt) return;
        const label = link?.conditionExpr || link?.properties?.value || '';
        const sourceNode = activityMap?.[src] || null;
        const sourceHandle = mapVisualizerHandleId(sourceNode, link, label);
        linkList[idx] = {
          ...link,
          edgeId: link?.id || `${src}-${tgt}-${idx}`,
          layoutLabel: label,
          mappedHandle: sourceHandle,
          isErrorEdge: isVisualizerErrorHandle(sourceHandle),
        };
      });
      const layoutEdges = linkList
        .filter(link => link?.sourceActivityId && link?.targetActivityId)
        .map(link => ({
          id: link.edgeId,
          source: link.sourceActivityId,
          target: link.targetActivityId,
          sourceHandle: link.mappedHandle || link.layoutLabel || '',
        }));
      const explicitPositionCount = layoutNodes.reduce((count, node) => count + (widgetPointMap.has(node.id) ? 1 : 0), 0);
      let positionedNodes;
      if (explicitPositionCount) {
        positionedNodes = buildExplicitLayoutNodes(layoutNodes, widgetPointMap, linkList, linkWidgetMap);
      } else {
        const layoutResult = window.getAutoLayoutedElements(layoutNodes, layoutEdges);
        positionedNodes = Array.isArray(layoutResult?.nodes) ? layoutResult.nodes : layoutNodes;
      }
      const minNodeX = positionedNodes.reduce((min, node) => Math.min(min, Number(node?.position?.x) || 0), Infinity);
      const minNodeY = positionedNodes.reduce((min, node) => Math.min(min, Number(node?.position?.y) || 0), Infinity);
      const normalizedOffsetX = Number.isFinite(minNodeX) ? -minNodeX : 0;
      const normalizedOffsetY = Number.isFinite(minNodeY) ? -minNodeY : 0;
      positionedNodes = positionedNodes.map(node => ({
        ...node,
        position: {
          x: (Number(node?.position?.x) || 0) + normalizedOffsetX,
          y: (Number(node?.position?.y) || 0) + normalizedOffsetY,
        },
      }));
      const nodeById = new Map(positionedNodes.map(node => [node.id, node]));
      const pad = 160;

      const escapeXml = (val) => String(val || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');

      const marker = `
        <defs>
          <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="${defaultEdgeArrowStroke}"></path>
          </marker>
        </defs>
      `;

      let edgesSvg = '';
      const rectsIntersect = (a, b) => {
        if (!a || !b) return false;
        return !(a.right < b.left || a.left > b.right || a.bottom < b.top || a.top > b.bottom);
      };
      const getSourceAnchor = (node, edge) => {
        const width = node?.data?.width || 300;
        const height = node?.data?.height || 120;
        const rows = Array.isArray(node?.data?.outputRows) ? node.data.outputRows : [];
        const headerHeight = 42;
        const bodyStart = node.position.y + headerHeight + 18 + pad;
        if (rows.length) {
          const rawLabel = String(edge?.mappedHandle || edge?.layoutLabel || 'out').trim().toLowerCase();
          const rowIndex = Math.max(0, rows.findIndex(row => row.matchKey === rawLabel));
          const textY = bodyStart + rowIndex * 18;
          return {
            x: node.position.x + width + pad,
            y: textY - 4,
          };
        }
        const usableTop = 56;
        const usableHeight = Math.max(24, height - usableTop - 14);
        const total = 1;
        const step = usableHeight / (total + 1);
        return {
          x: node.position.x + width + pad,
          y: node.position.y + usableTop + step + pad,
        };
      };
      const getTargetAnchor = (node) => ({
        x: node.position.x + pad,
        y: node.position.y + 24 + pad,
      });
      const buildCurvedPath = (sourceNode, targetNode, edge) => {
        const sourcePoint = getSourceAnchor(sourceNode, edge);
        const targetPoint = getTargetAnchor(targetNode);
        const dx = targetPoint.x - sourcePoint.x;
        const hDist = dx < 50 ? Math.max(80, Math.abs(dx) * 0.25 + 60) : Math.max(Math.abs(dx) * 0.45, 60);
        const c1x = sourcePoint.x + hDist;
        const c1y = dx < 50 ? Math.min(sourcePoint.y, targetPoint.y) - Math.max(60, Math.abs(dx) * 0.15 + 40) : sourcePoint.y;
        const c2x = targetPoint.x - hDist;
        const c2y = dx < 50 ? c1y : targetPoint.y;
        return {
          path: `M ${sourcePoint.x} ${sourcePoint.y} C ${c1x} ${c1y}, ${c2x} ${c2y}, ${targetPoint.x} ${targetPoint.y}`,
          midX: (sourcePoint.x + 3 * c1x + 3 * c2x + targetPoint.x) / 8,
          midY: (sourcePoint.y + 3 * c1y + 3 * c2y + targetPoint.y) / 8,
          sourceY: sourcePoint.y,
          targetY: targetPoint.y,
        };
      };
      linkList.forEach(edge => {
        const sourceNode = nodeById.get(edge?.sourceActivityId || '');
        const targetNode = nodeById.get(edge?.targetActivityId || '');
        if (!sourceNode || !targetNode) return;
        const curve = buildCurvedPath(sourceNode, targetNode, edge);
        const stroke = edge?.isErrorEdge ? edgeErrorStroke : defaultEdgeStroke;
        edgesSvg += `<path d="${curve.path}" stroke="${stroke}" stroke-width="2" fill="none" marker-end="url(#arrow)" />`;
      });

      let nodesSvg = '';
      let maxX = 0;
      let maxY = 0;
      positionedNodes.forEach(node => {
        const x = node.position.x + pad;
        const y = node.position.y + pad;
        const w = node?.data?.width || 300;
        const h = node?.data?.height || 120;
        const palette = node?.data?.palette || { header: '#e0e0e0', body: '#ffffff', border: '#bdbdbd', font: '#292929', icon: '#616161' };
        const title = node?.data?.title || 'Activity';
        const subtitle = node?.data?.subtitle || '';
        const bodyLines = Array.isArray(node?.data?.bodyLines) ? node.data.bodyLines : [];
        const outputRows = Array.isArray(node?.data?.outputRows) ? node.data.outputRows : [];
        const headerHeight = 42;
        maxX = Math.max(maxX, x + w);
        maxY = Math.max(maxY, y + h);
        nodesSvg += `
          <g class="diagramNodeGroup">
            <rect x="${x}" y="${y}" width="${w}" height="${h}" rx="12" ry="12"
              fill="${palette.body}" stroke="${palette.border}" stroke-width="1.4"
              ${node?.data?.isStartNode ? 'data-start-node="true"' : ''}></rect>
            <path d="M ${x + 12} ${y} H ${x + w - 12} Q ${x + w} ${y} ${x + w} ${y + 12} V ${y + headerHeight} H ${x} V ${y + 12} Q ${x} ${y} ${x + 12} ${y} Z"
              fill="${palette.header}"></path>
            <line x1="${x}" y1="${y + headerHeight}" x2="${x + w}" y2="${y + headerHeight}" stroke="${palette.border}" stroke-width="1"></line>
            <text x="${x + 14}" y="${y + 18}" font-size="13" font-weight="700" fill="${palette.font}">${escapeXml(title)}</text>
            <text x="${x + 14}" y="${y + 33}" font-size="10" fill="${palette.subtitle}">${escapeXml(subtitle)}</text>
        `;
        const bodyStart = y + headerHeight + 18;
        bodyLines.forEach((line, idx) => {
          const dy = bodyStart + idx * 15;
          nodesSvg += `<text x="${x + 14}" y="${dy}" font-size="10" fill="${palette.bodyText}">${escapeXml(line)}</text>`;
        });
        if (!bodyLines.length && !outputRows.length) {
          nodesSvg += `<text x="${x + 14}" y="${y + headerHeight + 18}" font-size="10" fill="${palette.subtitle}">No details</text>`;
        }
        outputRows.forEach((row, idx) => {
          const textY = bodyStart + idx * 18;
          const circleCx = x + w - 18;
          const circleCy = textY - 4;
          const rowColor = row?.isError ? palette.errorOutput : palette.output;
          nodesSvg += `
            <text x="${circleCx - 10}" y="${textY}" font-size="10" fill="${rowColor}" text-anchor="end">${escapeXml(row?.text || '')}</text>
            <circle cx="${circleCx}" cy="${circleCy}" r="4.5" fill="${rowColor}" stroke="${palette.bulletStroke}" stroke-width="1.2"></circle>
          `;
        });
        nodesSvg += '</g>';
      });
      const width = Math.max(900, maxX + pad);
      const height = Math.max(600, maxY + pad);

      const svg = `
        <svg class="diagramSvg" xmlns="http://www.w3.org/2000/svg" width="${width + pad}" height="${height + pad}" viewBox="0 0 ${width + pad} ${height + pad}">
          ${marker}
          ${edgesSvg}
          ${nodesSvg}
        </svg>
      `;
      return { svg, width: width + pad * 2, height: height + pad * 2 };
    }

    async function openFlowDiagram(flowId) {
      const token = getToken();
      if (!token) {
        window.location.href = '../../index.html';
        return;
      }
      const flow = flows.find(f => f?.id === flowId);
      const flowName = flow ? getFlowName(flow) : 'Flow';
      let payload = {};
      try {
        payload = await fetchFlowExportJson(flowId, token);
      } catch {
        payload = {};
      }
      const activityMap = findActivityMap(payload);
      const links = findLinks(payload);
      const { mainMap, eventMap, mainLinks, eventLinks } = buildFlowSections(activityMap, links, payload);
      const mainIds = new Set(mainMap ? Object.keys(mainMap) : []);
      const eventIds = new Set(eventMap ? Object.keys(eventMap) : []);
      const { mainWidgetPoints, eventWidgetPoints, mainLinkWidgets, eventLinkWidgets } = collectDiagramWidgetPointMaps(payload);
      const mainWidgetPointMap = filterDiagramWidgetPoints(mainWidgetPoints, mainIds);
      const eventWidgetPointMap = eventIds.size
        ? filterDiagramWidgetPoints(eventWidgetPoints.size ? eventWidgetPoints : mainWidgetPoints, eventIds)
        : new Map();
      const mainLinkWidgetMap = mainLinkWidgets instanceof Map ? mainLinkWidgets : new Map();
      const eventLinkWidgetMap = eventLinkWidgets.size
        ? eventLinkWidgets
        : mainLinkWidgetMap;

      const queueDetailMap = new Map();
      if (activityMap && currentOrgId) {
        const queueIds = new Set();
        Object.values(activityMap).forEach(activity => {
          if (!activity || typeof activity !== 'object') return;
          const props = activity.properties || {};
          const actName = String(props.activityName || '').toLowerCase();
          if (actName !== 'queue-contact') return;
          const destId = props.destination || props.destinationId || '';
          if (destId) queueIds.add(destId);
        });
        const ids = Array.from(queueIds);
        if (ids.length) {
          const fetches = ids.map(async (queueId) => {
            if (queueDetailCache.has(queueId)) return;
            try {
              const url = `https://api.wxcc-us1.cisco.com/organization/${encodeURIComponent(currentOrgId)}/v2/contact-service-queue/${encodeURIComponent(queueId)}`;
              const res = await fetch(url, { headers: { Authorization: `Bearer ${token}` } });
              if (!res.ok) return;
              const detail = await res.json();
              queueDetailCache.set(queueId, detail);
            } catch {
              // Ignore queue detail failures.
            }
          });
          await Promise.all(fetches);
        }
        ids.forEach(id => {
          const detail = queueDetailCache.get(id);
          if (detail) queueDetailMap.set(id, detail);
        });
      }

      const mainDiagram = mainMap && mainIds.size
        ? buildDiagramSvg(mainMap, mainLinks, { queueDetailMap, widgetPointMap: mainWidgetPointMap, linkWidgetMap: mainLinkWidgetMap })
        : { svg: '<div class="status">No main-flow activities found.</div>' };
      const eventDiagram = eventMap && Object.keys(eventMap).length
        ? buildDiagramSvg(eventMap, eventLinks, { queueDetailMap, widgetPointMap: eventWidgetPointMap, linkWidgetMap: eventLinkWidgetMap })
        : { svg: '<div class="status">No event-flow activities found.</div>' };

      const existing = document.getElementById('flowDiagramModal');
      if (existing) existing.remove();
      const modal = document.createElement('div');
      modal.id = 'flowDiagramModal';
      modal.className = 'dissectOverlay';
      modal.innerHTML = `
        <div class="dissectCard diagramCard" role="dialog" aria-modal="true">
          <div class="dissectHeader">
            <div>
              <div class="dissectTitle">Flow Diagram: ${escapeHtml(flowName)}</div>
              <div class="dissectMeta">${escapeHtml(flowId || '')}</div>
            </div>
            <div class="dissectActions">
              <button class="btn" id="diagramDownloadPdfBtn" type="button">Save PDF</button>
              <button class="btn primary" id="diagramCloseBtn" type="button">Close</button>
            </div>
          </div>
          <div class="dissectBody">
            <div class="diagramTabs">
              <button class="diagramTabBtn active" type="button" data-diagram-tab="main">Main Flow</button>
              <button class="diagramTabBtn" type="button" data-diagram-tab="event">Event Flow</button>
            </div>
            <div class="diagramTabPanel active" data-diagram-panel="main">
              <div class="diagramWrap" data-diagram-wrap>
                <div class="diagramSurface" data-diagram-surface>
                  <div class="diagramSection">
                    <div class="diagramSectionTitle">Main Flow</div>
                    ${mainDiagram.svg}
                  </div>
                </div>
              </div>
            </div>
            <div class="diagramTabPanel" data-diagram-panel="event">
              <div class="diagramWrap" data-diagram-wrap>
                <div class="diagramSurface" data-diagram-surface>
                  <div class="diagramSection">
                    <div class="diagramSectionTitle">Event Flow</div>
                    ${eventDiagram.svg}
                  </div>
                </div>
              </div>
            </div>

            <div class="diagramFloatingControls">
              <button class="diagramIconBtn" id="diagramZoomOutBtn" type="button" title="Zoom out" aria-label="Zoom out">−</button>
              <button class="diagramIconBtn" id="diagramZoomInBtn" type="button" title="Zoom in" aria-label="Zoom in">+</button>
              <button class="diagramIconBtn" id="diagramFitBtn" type="button" title="Fit to window" aria-label="Fit to window">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <polyline points="9 3 3 3 3 9"></polyline>
                  <polyline points="15 3 21 3 21 9"></polyline>
                  <polyline points="3 15 3 21 9 21"></polyline>
                  <polyline points="21 15 21 21 15 21"></polyline>
                </svg>
              </button>
            </div>
          </div>
        </div>
      `;
      document.body.appendChild(modal);
      requestAnimationFrame(() => modal.classList.add('show'));

      const closeModal = () => {
        modal.classList.remove('show');
        setTimeout(() => modal.remove(), 200);
      };
      modal.querySelector('#diagramCloseBtn')?.addEventListener('click', closeModal);
      modal.addEventListener('click', (event) => {
        if (event.target === modal) closeModal();
      });
      window.addEventListener('keydown', (event) => {
        if (event.key === 'Escape') closeModal();
      }, { once: true });

      const tabButtons = Array.from(modal.querySelectorAll('[data-diagram-tab]'));
      const tabPanels = Array.from(modal.querySelectorAll('[data-diagram-panel]'));
      const wraps = Array.from(modal.querySelectorAll('[data-diagram-wrap]'));
      const surfaces = Array.from(modal.querySelectorAll('[data-diagram-surface]'));
      const zoomInBtn = modal.querySelector('#diagramZoomInBtn');
      const zoomOutBtn = modal.querySelector('#diagramZoomOutBtn');
      const zoomFitBtn = modal.querySelector('#diagramFitBtn');
      const DEFAULT_ZOOM = 0.9;
      const clampZoom = (value) => Math.min(6, Math.max(0.3, value));
      let zoomValue = DEFAULT_ZOOM;
      const applyZoom = (value) => {
        zoomValue = clampZoom(value);
        surfaces.forEach(surface => {
          if (surface) surface.style.transform = `scale(${zoomValue})`;
        });
      };
      applyZoom(DEFAULT_ZOOM);

      const scrollToStart = () => {
        wraps.forEach((wrap, idx) => {
          const surface = surfaces[idx];
          if (!wrap || !surface) return;
          const svgEl = surface.querySelector('svg');
          if (!svgEl) return;
          const startNode = svgEl.querySelector('[data-start-node="true"]');
          if (!startNode) return;
          const x = Number(startNode.getAttribute('x') || 0);
          const y = Number(startNode.getAttribute('y') || 0);
          const targetX = Math.max(0, x * zoomValue - wrap.clientWidth / 2);
          const targetY = Math.max(0, y * zoomValue - wrap.clientHeight / 2);
          wrap.scrollTo({ left: targetX, top: targetY, behavior: 'instant' });
        });
      };
      requestAnimationFrame(scrollToStart);

      zoomInBtn?.addEventListener('click', () => applyZoom(zoomValue + 0.1));
      zoomOutBtn?.addEventListener('click', () => applyZoom(zoomValue - 0.1));
      const fitVisiblePanel = () => {
        const activePanel = tabPanels.find(panel => panel.classList.contains('active')) || tabPanels[0];
        if (!activePanel) return;
        const wrap = activePanel.querySelector('[data-diagram-wrap]');
        const surface = activePanel.querySelector('[data-diagram-surface]');
        const svgEl = activePanel.querySelector('svg');
        if (!wrap || !surface || !svgEl) return;
        const box = svgEl.viewBox?.baseVal;
        const contentW = box?.width || svgEl.width?.baseVal?.value || svgEl.clientWidth || 1;
        const contentH = box?.height || svgEl.height?.baseVal?.value || svgEl.clientHeight || 1;
        const pad = 24;
        const fitX = (wrap.clientWidth - pad * 2) / contentW;
        const fitY = (wrap.clientHeight - pad * 2) / contentH;
        const fitZoom = clampZoom(Math.min(fitX, fitY));
        applyZoom(fitZoom);
        wrap.scrollTo({ left: 0, top: 0, behavior: 'instant' });
      };
      zoomFitBtn?.addEventListener('click', fitVisiblePanel);
      const onWheelZoom = (event) => {
        if (!event.ctrlKey && !event.metaKey) return;
        event.preventDefault();
        const wrap = event.currentTarget;
        if (!(wrap instanceof HTMLElement)) return;
        const rect = wrap.getBoundingClientRect();
        const pointerX = event.clientX - rect.left + wrap.scrollLeft;
        const pointerY = event.clientY - rect.top + wrap.scrollTop;
        const normalizedDelta = Math.max(-18, Math.min(18, -event.deltaY));
        const zoomStep = normalizedDelta * 0.0045;
        if (Math.abs(zoomStep) < 0.002) return;
        const nextZoom = clampZoom(zoomValue + zoomStep);
        if (nextZoom === zoomValue) return;
        const scaleRatio = nextZoom / zoomValue;
        applyZoom(nextZoom);
        const nextLeft = (pointerX * scaleRatio) - (event.clientX - rect.left);
        const nextTop = (pointerY * scaleRatio) - (event.clientY - rect.top);
        wrap.scrollLeft = Math.max(0, nextLeft);
        wrap.scrollTop = Math.max(0, nextTop);
      };
      wraps.forEach(wrap => {
        wrap.addEventListener('wheel', onWheelZoom, { passive: false });
      });
      tabButtons.forEach(btn => {
        btn.addEventListener('click', () => {
          const key = btn.dataset.diagramTab || 'main';
          tabButtons.forEach(b => b.classList.toggle('active', b === btn));
          tabPanels.forEach(panel => panel.classList.toggle('active', panel.dataset.diagramPanel === key));
          applyZoom(zoomValue);
        });
      });
      

      

      const pdfBtn = modal.querySelector('#diagramDownloadPdfBtn');
      pdfBtn?.addEventListener('click', async () => {
        const PdfDoc = getPdfLibrary();
        const CanvgLib = (window.Canvg || (window.canvg && (window.canvg.Canvg || window.canvg)) || null);
        if (!PdfDoc || !CanvgLib || !CanvgLib.fromString) {
          if (statusText) statusText.textContent = 'PDF libraries unavailable. Refresh and try again.';
          return;
        }
        if (statusText) statusText.textContent = 'Exporting PDF...';
        const exportDiagrams = [];
        if (mainMap && mainIds.size) {
          const rendered = buildDiagramSvg(mainMap, mainLinks, { queueDetailMap, widgetPointMap: mainWidgetPointMap, linkWidgetMap: mainLinkWidgetMap, forceLightTheme: true });
          if (rendered?.svg) exportDiagrams.push({ label: 'Main Flow', svg: rendered.svg, width: rendered.width, height: rendered.height });
        }
        if (eventMap && Object.keys(eventMap).length) {
          const rendered = buildDiagramSvg(eventMap, eventLinks, { queueDetailMap, widgetPointMap: eventWidgetPointMap, linkWidgetMap: eventLinkWidgetMap, forceLightTheme: true });
          if (rendered?.svg) exportDiagrams.push({ label: 'Event Flow', svg: rendered.svg, width: rendered.width, height: rendered.height });
        }
        if (!exportDiagrams.length) {
          if (statusText) statusText.textContent = 'No diagrams found to export.';
          return;
        }

        const flow = flows.find(f => f?.id === flowId);
        const flowName = flow ? getFlowName(flow) : 'Flow';
        const flowIdText = flowId || '';
        const channels = formatChannelsForExport(flowId) || '';
        const modifiedBy = flow ? getModifiedBy(flow) : '';
        const modifiedDate = flow ? getModifiedDate(flow) : '';
        const version = flow?.version || flow?.flowVersion || flow?.lastModifiedVersion || '';

        const headerLines = [
          `Flow: ${flowName}`,
          flowIdText ? `Flow ID: ${flowIdText}` : '',
          version ? `Version: ${version}` : '',
          channels ? `Channels: ${channels}` : '',
          modifiedBy ? `Last Modified By: ${modifiedBy}` : '',
          modifiedDate ? `Last Modified: ${modifiedDate}` : '',
        ].filter(Boolean);

        try {
          let doc = null;
          for (let i = 0; i < exportDiagrams.length; i += 1) {
            const { label, svg: svgText, width: renderedWidth, height: renderedHeight } = exportDiagrams[i];
            const width = Math.max(1, renderedWidth || 1200);
            const height = Math.max(1, renderedHeight || 800);
            const canvas = document.createElement('canvas');
            const scale = 2;
            canvas.width = Math.ceil(width * scale);
            canvas.height = Math.ceil(height * scale);
            const ctx = canvas.getContext('2d');
            if (ctx) {
              ctx.setTransform(scale, 0, 0, scale, 0, 0);
              ctx.fillStyle = '#ffffff';
              ctx.fillRect(0, 0, width, height);
            }
            const renderer = await CanvgLib.fromString(ctx, svgText);
            await renderer.render();
            const imgData = canvas.toDataURL('image/png');

          const padding = 16;
          const headerFont = 10;
          const headerLineHeight = headerFont + 4;
          const headerHeight = headerLines.length ? (headerLines.length * headerLineHeight + padding * 2) : 0;
          const drawW = width + padding * 2;
          const drawH = height + padding * 2 + headerHeight + 18;
          if (!doc) {
            doc = new PdfDoc({ unit: 'pt', format: [drawW, drawH], orientation: drawW >= drawH ? 'landscape' : 'portrait' });
          } else {
            doc.addPage([drawW, drawH], drawW >= drawH ? 'landscape' : 'portrait');
          }

          let currentY = padding;
          if (headerLines.length) {
            const bubblePadding = 10;
            const bubbleWidth = Math.min(drawW - padding * 2, 520);
            const bubbleHeight = headerLines.length * headerLineHeight + bubblePadding * 2;
            const bubbleX = padding;
            const bubbleY = padding;
            doc.setFillColor(245, 247, 250);
            doc.setDrawColor(220, 224, 230);
            doc.roundedRect(bubbleX, bubbleY, bubbleWidth, bubbleHeight, 8, 8, 'FD');
            doc.setFontSize(headerFont);
            doc.setTextColor('#111111');
            headerLines.forEach((line, idx) => {
              doc.text(line, bubbleX + bubblePadding, bubbleY + bubblePadding + headerFont + idx * headerLineHeight);
            });
            currentY = bubbleY + bubbleHeight + 10;
          }

          doc.setFontSize(11);
          doc.setTextColor('#111111');
          doc.text(label, padding, currentY + 12);
          const imageY = currentY + 20;
          const imageX = padding;
            doc.addImage(imgData, 'PNG', imageX, imageY, width, height);
          }

          if (doc) {
            doc.save(`${sanitizeFilename(flowName)}_flow_diagram.pdf`);
            if (statusText) statusText.textContent = 'PDF saved.';
          }
        } catch (err) {
          if (statusText) statusText.textContent = `PDF export failed: ${err.message}`;
        }
      });

      wraps.forEach(wrap => {
        if (!wrap) return;
        let isPanning = false;
        let panStartX = 0;
        let panStartY = 0;
        let startScrollLeft = 0;
        let startScrollTop = 0;

        const onPanStart = (event) => {
          isPanning = true;
          panStartX = event.clientX;
          panStartY = event.clientY;
          startScrollLeft = wrap.scrollLeft;
          startScrollTop = wrap.scrollTop;
          wrap.classList.add('panning');
        };
        const onPanMove = (event) => {
          if (!isPanning) return;
          const dx = event.clientX - panStartX;
          const dy = event.clientY - panStartY;
          wrap.scrollLeft = startScrollLeft - dx;
          wrap.scrollTop = startScrollTop - dy;
        };
        const onPanEnd = () => {
          isPanning = false;
          wrap.classList.remove('panning');
        };

        wrap.addEventListener('mousedown', (event) => {
          if (event.button !== 0) return;
          if (event.target instanceof Element && event.target.closest('.diagramNodeGroup')) return;
          onPanStart(event);
        });
        wrap.addEventListener('mousemove', onPanMove);
        wrap.addEventListener('mouseup', onPanEnd);
        wrap.addEventListener('mouseleave', onPanEnd);
      });
    }

    async function fetchFlowExport(flowId, bearer) {
      const url = FLOW_EXPORT_ENDPOINT(currentOrgId, currentProjectId, flowId);
      const res = await fetch(url, { headers: { Authorization: `Bearer ${bearer}` } });
      if (!res.ok) {
        throw new Error(`HTTP ${res.status}`);
      }
      const text = await res.text();
      let payload = text;
      try {
        const parsed = JSON.parse(text);
        payload = JSON.stringify(parsed, null, 2);
      } catch {
        payload = text;
      }
      const flow = flows.find(f => f?.id === flowId);
      const flowName = flow ? getFlowName(flow) : 'flow';
      const filename = `${sanitizeFilename(flowName)}.json`;
      return { filename, payload };
    }

    async function fetchFlowExportJson(flowId, bearer) {
      const url = FLOW_EXPORT_ENDPOINT(currentOrgId, currentProjectId, flowId);
      const res = await fetch(url, { headers: { Authorization: `Bearer ${bearer}` } });
      if (!res.ok) {
        throw new Error(`HTTP ${res.status}`);
      }
      const text = await res.text();
      try {
        return JSON.parse(text);
      } catch {
        return {};
      }
    }

    async function exportFlowById(flowId, bearer) {
      const { filename, payload } = await fetchFlowExport(flowId, bearer);
      const blob = new Blob([payload], { type: 'application/json' });
      downloadBlob(blob, filename);
    }

    function getPdfLibrary() {
      return window.jspdf && window.jspdf.jsPDF ? window.jspdf.jsPDF : null;
    }

    async function exportSelectedFlows() {
      const bearer = getToken();
      if (!bearer) {
        window.location.href = '../../index.html';
        return;
      }

      const selectedIds = Array.from(selectedFlowIds);
      if (!selectedIds.length) return;

      exportSelectedBtn.disabled = true;
      exportSelectedBtn.textContent = `Exporting ${selectedIds.length}...`;
      statusText.textContent = `Exporting ${selectedIds.length} flows...`;

      let success = 0;
      let failed = 0;

      if (selectedIds.length === 1) {
        try {
          await exportFlowById(selectedIds[0], bearer);
          success = 1;
        } catch (err) {
          failed = 1;
          console.warn(`Failed to export flow ${selectedIds[0]}:`, err.message);
        }
      } else {
        if (typeof JSZip === 'undefined') {
          exportSelectedBtn.disabled = selectedFlowIds.size === 0;
          exportSelectedBtn.textContent = 'Export Selected';
          statusText.textContent = 'Zip library unavailable. Refresh and try again.';
          return;
        }
        const zip = new JSZip();
        for (const flowId of selectedIds) {
          try {
            const { filename, payload } = await fetchFlowExport(flowId, bearer);
            zip.file(filename, payload);
            success += 1;
          } catch (err) {
            failed += 1;
            console.warn(`Failed to export flow ${flowId}:`, err.message);
          }
        }
        if (success) {
          const stamp = new Date().toISOString().slice(0, 10);
          const zipBlob = await zip.generateAsync({ type: 'blob' });
          downloadBlob(zipBlob, `wxcc_flows_${stamp}.zip`);
        }
      }

      exportSelectedBtn.disabled = selectedFlowIds.size === 0;
      exportSelectedBtn.textContent = 'Export Selected';
      if (!success) {
        statusText.textContent = `Failed to export ${failed} flows.`;
      } else {
        statusText.textContent = `Exported ${success} flows${failed ? `, ${failed} failed` : ''}.`;
      }
    }

    function formatChannelsForExport(flowId) {
      const items = flowChannelMap.get(flowId) || [];
      if (!items.length) return '';
      return items.map(item => {
        const name = item?.name || 'Unnamed entry point';
        const type = item?.channelType || '';
        const nums = formatDialNumbers(item?.dialNumbers || []).join(', ');
        return [name, type, nums].filter(Boolean).join(' | ');
      }).join('; ');
    }



    flowListEl.addEventListener('change', (event) => {
      const target = event.target;
      if (target.classList.contains('rowCheckbox')) {
        const flowId = target.dataset.flowId;
        if (target.checked) {
          selectedFlowIds.add(flowId);
        } else {
          selectedFlowIds.delete(flowId);
        }
        renderFlows();
      }
      if (target.id === 'selectAllFlows') {
        const filtered = applyChannelFilter(applySearch(flows));
        if (target.checked) {
          filtered.forEach(flow => {
            if (flow?.id) selectedFlowIds.add(flow.id);
          });
        } else {
          filtered.forEach(flow => {
            if (flow?.id) selectedFlowIds.delete(flow.id);
          });
        }
        renderFlows();
      }
    });

    flowListEl.addEventListener('click', async (event) => {
      const showMoreBtn = event.target.closest('[data-show-more-channels]');
      if (showMoreBtn) {
        const flowId = showMoreBtn.dataset.showMoreChannels || '';
        if (flowId) openChannelDetailModal(flowId);
        return;
      }
      const sortBtn = event.target.closest('.sortBtn');
      if (sortBtn) {
        const key = sortBtn.dataset.sort;
        if (key) {
          if (sortKey === key) {
            sortDir = sortDir === 'asc' ? 'desc' : 'asc';
          } else {
            sortKey = key;
            sortDir = 'asc';
          }
          renderFlows();
        }
        return;
      }
      const exportBtn = event.target.closest('.exportBtn');
      if (exportBtn) {
        const flowId = exportBtn.dataset.flowId || '';
        if (!flowId) return;
        const bearer = getToken();
        if (!bearer) {
          window.location.href = '../../index.html';
          return;
        }
        const flow = flows.find(f => f?.id === flowId);
        const flowName = flow ? getFlowName(flow) : 'flow';
        exportBtn.disabled = true;
        const prevLabel = exportBtn.textContent;
        exportBtn.textContent = 'Exporting...';
        statusText.textContent = `Exporting ${flowName}...`;
        try {
          await exportFlowById(flowId, bearer);
          statusText.textContent = `Exported ${flowName}.`;
        } catch (err) {
          statusText.textContent = `Failed to export ${flowName}.`;
        } finally {
          exportBtn.disabled = false;
          exportBtn.textContent = prevLabel;
        }
        return;
      }
      const visualizeBtn = event.target.closest('.visualizeBtn');
      if (visualizeBtn) {
        const flowId = visualizeBtn.dataset.flowId || '';
        if (!flowId) return;
        visualizeBtn.disabled = true;
        const prevLabel = visualizeBtn.textContent;
        visualizeBtn.textContent = 'Building...';
        statusText.textContent = 'Building flow diagram...';
        try {
          await openFlowDiagram(flowId);
          statusText.textContent = 'Flow diagram ready.';
        } catch {
          statusText.textContent = 'Failed to build flow diagram.';
        } finally {
          visualizeBtn.disabled = false;
          visualizeBtn.textContent = prevLabel;
        }
        return;
      }
      const dissectBtn = event.target.closest('.dissectBtn');
      if (dissectBtn) {
        const flowId = dissectBtn.dataset.flowId || '';
        if (!flowId) return;
        await analyzeFlowDissect(flowId);
        return;
      }
      const btn = event.target.closest('.copyInline');
      if (!btn) return;
      const text = btn.dataset.copy || '';
      if (!text) return;
      try {
        await navigator.clipboard.writeText(text);
      } catch {
        const tmp = document.createElement('textarea');
        tmp.value = text;
        document.body.appendChild(tmp);
        tmp.select();
        document.execCommand('copy');
        tmp.remove();
      }
    });

    searchInput.addEventListener('input', (event) => {
      searchTerm = event.target.value.trim();
      renderFlows();
    });
    exportSelectedBtn.addEventListener('click', exportSelectedFlows);
    

    flowListEl.addEventListener('click', (event) => {
      if (event.target.closest('.filterPopover')) {
        event.stopPropagation();
      }
      const btn = event.target.closest('[data-filter-btn]');
      if (!btn) return;
      const key = btn.dataset.filterBtn;
      if (!key) return;
      const popover = flowListEl.querySelector(`[data-filter-popover="${key}"]`);
      if (!popover) return;
      const isOpen = popover.classList.contains('open');
      flowListEl.querySelectorAll('.filterPopover.open').forEach(el => el.classList.remove('open'));
      if (!isOpen) {
        popover.classList.add('open');
        activeFilterKey = key;
        const rect = btn.getBoundingClientRect();
        const popoverWidth = popover.offsetWidth || 260;
        const left = Math.max(12, Math.min(rect.left, window.innerWidth - popoverWidth - 12));
        const top = rect.bottom + 8;
        popover.style.left = `${left}px`;
        popover.style.top = `${top}px`;
        renderFilterPopover(key);
        const searchEl = popover.querySelector('.filterSearch');
        if (searchEl) searchEl.focus();
      } else {
        activeFilterKey = '';
      }
    });

    flowListEl.addEventListener('input', (event) => {
      const input = event.target;
      if (input?.matches('[data-filter-search]')) {
        event.stopPropagation();
        const key = input.dataset.filterSearch;
        filterSearchTerms[key] = input.value || '';
        renderFilterPopover(key);
      }
    });

    flowListEl.addEventListener('change', (event) => {
      const input = event.target;
      if (input?.matches('input[data-filter-value][data-filter-key]')) {
        event.stopPropagation();
        setFilterValue(input.dataset.filterKey, input.dataset.filterValue, input.checked);
      }
    });

    document.addEventListener('click', (event) => {
      if (!activeFilterKey) return;
      const popover = flowListEl.querySelector(`[data-filter-popover="${activeFilterKey}"]`);
      const button = flowListEl.querySelector(`[data-filter-btn="${activeFilterKey}"]`);
      if (!popover || !button) return;
      const within = popover.contains(event.target) || button.contains(event.target);
      if (!within) {
        popover.classList.remove('open');
        activeFilterKey = '';
      }
    });

    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape') {
        flowListEl.querySelectorAll('.filterPopover.open').forEach(el => el.classList.remove('open'));
        activeFilterKey = '';
      }
    });

    const userNameEl = document.getElementById('userName');
    const userOrgEl = document.getElementById('userOrg');
    if (userNameEl) userNameEl.textContent = getUser() || 'Authenticated';
    if (userOrgEl) userOrgEl.textContent = getOrg() || '';

    const signOutBtn = document.getElementById('signOutBtn');
    if (signOutBtn) {
      signOutBtn.addEventListener('click', () => {
        localStorage.removeItem(cacheKeyBearer);
        localStorage.removeItem(cacheKeyOrg);
        localStorage.removeItem(cacheKeyOrgName);
        localStorage.removeItem(cacheKeyUser);
        localStorage.removeItem('authRefreshToken');
        localStorage.removeItem('authExpiresAt');
        window.location.href = '../../index.html';
      });
    }


    document.addEventListener('click', (event) => {
    });

    document.addEventListener('keydown', (event) => {
    });

    fetchFlows();
  </script>
