<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light" />
  <title>WxCC - Flows</title>
  <link rel="stylesheet" href="../../assets/css/theme.css">

  <link rel="icon" type="image/png" href="../../assets/images/WxCC_Icon-192.png" />
  <style>
    main { padding:32px 0 80px; display:flex; justify-content:flex-start; }
    .actionsRow { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
    .actionsRow .spacer { flex:1; }
    .flowTable { margin-top:16px; border:1px solid var(--border); border-radius:14px; overflow:hidden; box-shadow:var(--shadow); }
    .flowHeader, .flowRow { display:grid; grid-template-columns:52px minmax(220px, 1.2fr) minmax(200px, 1.5fr) minmax(200px, 1.25fr) minmax(210px, 1.1fr) 260px; align-items:center; }
    .flowHeader { background:var(--panel); color:var(--accent); font-weight:700; font-size:12px; letter-spacing:.01em; }
    .flowHeader .headerCell { position:relative; }
    .flowRow { background:var(--card); border-top:1px solid var(--border); }
    .flowRow:nth-child(even) { background:var(--input); }
    .flowRow:hover { background:rgba(8,172,242,.08); }
    .flowCell { padding:12px; display:flex; align-items:center; gap:8px; min-height:46px; min-width:0; }
    .headerCell { padding:12px; min-height:46px; display:flex; flex-direction:column; gap:6px; align-items:flex-start; justify-content:center; }
    .sortBtn { display:inline-flex; align-items:center; gap:6px; font-weight:700; background:transparent; border:none; color:inherit; cursor:pointer; padding:0; }
    .sortBtn span { color:var(--muted); font-size:11px; }
    .headLabel { font-weight:700; }
    .flowName { font-weight:700; color:var(--fg); margin:0; font-size:14px; }
    .flowDesc { color:var(--muted); font-size:13px; line-height:1.4; max-width:320px; overflow:hidden; text-overflow:ellipsis; display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:2; }
    .flowId { color:var(--muted); font-size:12px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:220px; }
    .flowName { max-width:220px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; display:block; }
    .flowCell.flowCol { overflow:hidden; }
    .muted { color:var(--muted); }
    .copyInline { background:transparent; border:1px solid var(--border); border-radius:8px; color:var(--muted); width:26px; height:26px; min-width:26px; display:inline-flex; align-items:center; justify-content:center; cursor:pointer; }
    .copyInline:hover { color:var(--fg); border-color:rgba(0,0,0,.2); }
    .rowBtn { display:inline-flex; align-items:center; justify-content:center; padding:6px 10px; border-radius:10px; border:1px solid var(--border); background:var(--card); color:var(--accent); font-size:12px; font-weight:700; cursor:pointer; }
    .rowBtn:hover { border-color:rgba(0,0,0,.2); background:var(--input); }

    a.flowLink { color:var(--accent-blue); text-decoration:none; }
    a.flowLink:hover { text-decoration:underline; }

    .channelItem { display:flex; flex-direction:column; gap:2px; min-width:0; overflow:hidden; }
    .channelName { font-weight:600; font-size:13px; color:var(--fg); }
    .channelMeta { font-size:11px; color:var(--muted); }
    .channelNums { font-size:12px; color:var(--accent-blue); }
    .channelMoreBtn { margin-top:2px; align-self:flex-start; }
    .flowCell.channelsCol { align-items:flex-start; overflow:hidden; }
    .channelName, .channelMeta, .channelNums { overflow-wrap:anywhere; }
    .filterIconBtn { display:inline-flex; align-items:center; justify-content:center; width:26px; height:26px; border-radius:6px; border:1px solid var(--border); background:var(--card); color:var(--accent); cursor:pointer; }
    .filterPopover { position:fixed; width:260px; background:var(--card); border:1px solid var(--border); border-radius:12px; box-shadow:var(--shadow); padding:12px; z-index:2000; display:none; }

    .filterSearch { width:100%; border-radius:10px; border:1px solid var(--border); background:var(--input); color:var(--fg); padding:8px 10px; font-size:12px; margin-bottom:8px; }
    .filterList { max-height:220px; overflow:auto; display:flex; flex-direction:column; gap:6px; }
    .filterItem { display:flex; align-items:center; gap:8px; font-size:12px; color:var(--fg); }

    .exportSelectedBtn { display:none; }
    .headerTop { display:flex; align-items:center; gap:8px; width:100%; }
    .modifiedStack { display:flex; flex-direction:column; gap:4px; min-width:0; }

    .rowActions { display:flex; flex-direction:column; gap:6px; width:100%; }

    .agentDetailOverlay {

    .agentDetailList { overflow:auto; padding-right:4px; display:flex; flex-direction:column; gap:6px; }
    .agentDetailItem { padding:8px 10px; border-radius:10px; border:1px solid var(--border); background:var(--card); font-size:12px; }

    .diagramWrap { width:100%; height:72vh; max-height:72vh; overflow:auto; border:1px solid var(--border); border-radius:14px; background:var(--panel); position:relative; cursor:grab; }
    .diagramWrap.panning { cursor:grabbing; }
    .diagramSvg {

    .diagramSectionTitle { font-size:12px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:0.08em; }
    .diagramLegend { font-size:12px; color:var(--muted); margin-top:10px; }
    .diagramCard {
      width:min(1800px, 99vw);

    .diagramFloatingControls {
      position:absolute;

    }
    body.dark-mode .diagramFloatingControls {

    }
    body.dark-mode .diagramWrap {
      background: rgba(5, 12, 28, 0.96);

    }
    body.dark-mode .diagramSection {

    }
    body.dark-mode .diagramCard {

    body.dark-mode .diagramTabBtn {

    body.dark-mode .diagramTabBtn.active {

    .diagramIconBtn {

    body.dark-mode .diagramIconBtn { background:rgba(255,255,255,.08); color:var(--fg); border-color:rgba(255,255,255,.18); }
    body.dark-mode .diagramIconBtn:hover { background:rgba(255,255,255,.14); border-color:rgba(255,255,255,.26); }
  </style>
</head>

  <main>

    <script src="../../assets/js/orbit-config.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script type="module">
  import { getLayoutedElements } from '../../assets/flow_visulizer/autoLayout.js';
  import { NODE_COLORS } from '../../assets/flow_visulizer/nodeColors.js';

  window.getAutoLayoutedElements = getLayoutedElements;
  window.FlowVisualizerNodeColors = NODE_COLORS;
</script>
  <script>
    const flowListEl = document.getElementById('flowList');
    const searchInput = document.getElementById('searchInput');
    const exportSelectedBtn = document.getElementById('exportSelectedBtn');
    const statusText = document.getElementById('statusText');
    const flowCountPill = document.getElementById('flowCountPill');
    const selectedCountPill = document.getElementById('selectedCountPill');

    const cacheKeyBearer = 'authBearer';
    const cacheKeyOrg = 'authOrg';
    const cacheKeyOrgName = 'authOrgName';
    const cacheKeyUser = 'authUserName';

    const FLOW_PROXY = window.ORBIT_PROXY_BASE + '/flows';
    const DEFAULT_PROJECT_ID = '5e5c9ad6d61f870d6d778c1b';
    const ENTRY_POINT_ENDPOINT = (orgId) => `https://api.wxcc-us1.cisco.com/organization/${encodeURIComponent(orgId)}/v2/entry-point?page=0&pageSize=200`;
    const DIAL_NUMBER_ENDPOINT = (orgId) => `https://api.wxcc-us1.cisco.com/organization/${encodeURIComponent(orgId)}/dial-number/bulk-export`;

    const FLOW_LIST_ENDPOINT = (orgId, projectId, page, pageSize) => {
      const base = `https://api.wxcc-us1.cisco.com/flow-store/${encodeURIComponent(orgId)}/project/${encodeURIComponent(projectId)}/flows?page=${page}&pageSize=${pageSize}&size=${pageSize}`;
      return `${FLOW_PROXY}?url=${encodeURIComponent(base)}`;
    };
    const proxyUrl = (url) => {
      if (!url) return '';
      if (url.startsWith(FLOW_PROXY)) return url;
      return `${FLOW_PROXY}?url=${encodeURIComponent(url)}`;
    };
    const FLOW_EXPORT_ENDPOINT = (orgId, projectId, flowId) => {
      const base = `https://api.wxcc-us1.cisco.com/flow-store/${encodeURIComponent(orgId)}/project/${encodeURIComponent(projectId)}/flows/${encodeURIComponent(flowId)}:export`;
      return `${FLOW_PROXY}?url=${encodeURIComponent(base)}`;
    };

    let flows = [];
    let searchTerm = '';
    let sortKey = 'name';
    let sortDir = 'asc';
    let selectedFlowIds = new Set();
    let currentOrgId = '';
    let currentProjectId = localStorage.getItem('wxccFlowProjectId') || DEFAULT_PROJECT_ID;
    let entryPoints = [];
    let dialNumberLookup = {};
    let flowChannelMap = new Map();
    let dissectCache = new Map();
    let queueDetailCache = new Map();
    let teamDetailCache = new Map();
    let userDetailCache = new Map();
    let dissectActiveId = '';
    const FILTER_BLANK_TOKEN = '__BLANK__';
    const CHANNEL_NONE_TOKEN = '__NO_CHANNELS__';
    const filterValues = {
      name: [],
      description: [],
      channels: [],
      modifiedBy: [],
    };
    const filterSelections = {
      name: new Set(),
      description: new Set(),
      channels: new Set(),
      modifiedBy: new Set(),
    };
    const filterSearchTerms = {
      name: '',
      description: '',
      channels: '',
      modifiedBy: '',
    };
    let activeFilterKey = '';

    function getToken(){ return (localStorage.getItem(cacheKeyBearer) || '').trim(); }
    function getOrg(){ return localStorage.getItem(cacheKeyOrgName) || localStorage.getItem(cacheKeyOrg) || ''; }
    function getUser(){ return localStorage.getItem(cacheKeyUser) || ''; }

    function getOrgIdValue() {
      const cached = localStorage.getItem('authOrgId') || '';
      if (cached) {
        if (/^Y2lz/i.test(cached)) {
          try {
            const padded = cached.replace(/-/g, '+').replace(/_/g, '/').padEnd(Math.ceil(cached.length / 4) * 4, '=');
            const decoded = atob(padded);
            const parts = decoded.split('/');
            const result = parts[parts.length - 1] || decoded;
            localStorage.setItem('authOrgId', result);
            return result;
          } catch {
            return cached;
          }
        }
        const orgPathIdx = cached.toLowerCase().indexOf('organization/');
        if (orgPathIdx !== -1) {
          const candidate = cached.slice(orgPathIdx + 'organization/'.length);
          if (candidate) {
            localStorage.setItem('authOrgId', candidate);
            return candidate;
          }
        }
        return cached;
      }
      const raw = localStorage.getItem(cacheKeyOrg) || '';
      if (!raw) return '';

      if (/^Y2lz/i.test(raw)) {
        try {
          const padded = raw.replace(/-/g, '+').replace(/_/g, '/').padEnd(Math.ceil(raw.length / 4) * 4, '=');
          const decoded = atob(padded);
          const parts = decoded.split('/');
          return parts[parts.length - 1] || decoded;
        } catch {
          return raw;
        }
      }

      const orgPathIdx = raw.toLowerCase().indexOf('organization/');
      if (orgPathIdx !== -1) {
        const candidate = raw.slice(orgPathIdx + 'organization/'.length);
        return candidate || raw;
      }

      return raw;
    }

    function escapeHtml(val) {
      return String(val)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function escapeAttr(val) {
      return escapeHtml(val).replace(/`/g, '&#96;');
    }

    function formatEnum(val) {
      if (!val) return '';
      return val
        .toString()
        .split('_')
        .filter(Boolean)
        .map(word => word.charAt(0) + word.slice(1).toLowerCase())
        .join(' ');
    }

    function getChannelType(entry) {
      if (!entry) return '';
      return entry.channelType || entry.channel || entry.mediaType || entry.type || entry.channel?.type || entry.channel?.channelType || '';
    }

    function getFlowId(entry) {
      if (!entry) return '';
      return entry.flowId || entry.flowID || entry.flow?.id || entry.flow?.flowId || entry.flow?.flowID || '';
    }

    function formatDate(value) {
      if (!value) return '';
      let date;
      if (typeof value === 'number') {
        date = new Date(value < 1e12 ? value * 1000 : value);
      } else {
        const num = Number(value);
        if (!Number.isNaN(num) && String(value).trim() !== '') {
          date = new Date(num < 1e12 ? num * 1000 : num);
        } else {
          date = new Date(value);
        }
      }
      if (Number.isNaN(date.getTime())) return '';
      return date.toLocaleString();
    }

    function getFlowName(flow) {
      return flow?.name || flow?.flowName || flow?.title || 'Untitled flow';
    }

    function getFlowDescription(flow) {
      return flow?.description || flow?.summary || flow?.details || '';
    }

    function getModifiedBy(flow) {
      return flow?.lastModifiedBy?.name ||
        flow?.lastModifiedByName ||
        flow?.lastModifiedBy ||
        flow?.modifiedBy?.name ||
        flow?.modifiedByName ||
        flow?.modifiedBy ||
        flow?.updatedBy?.name ||
        flow?.updatedByName ||
        flow?.updatedBy ||
        '';
    }

    function getModifiedDate(flow) {
      return formatDate(
        flow?.lastModifiedTime ||
        flow?.lastModifiedAt ||
        flow?.lastModifiedDate ||
        flow?.modifiedTime ||
        flow?.modifiedAt ||
        flow?.updatedAt ||
        flow?.updatedOn ||
        flow?.lastUpdatedTime
      );
    }

    function sanitizeFilename(name) {
      return String(name || '')
        .replace(/[^a-z0-9_\-]+/gi, '_')
        .replace(/^_+|_+$/g, '')
        .slice(0, 80) || 'flow';
    }

    function getFlowEditorLink(flowId) {
      return currentOrgId && flowId
        ? `https://flow-control.produs1.ciscoccservice.com/flow/${encodeURIComponent(flowId)}?orgId=${encodeURIComponent(currentOrgId)}`
        : '';
    }

    function extractHandOffTargets(payload) {
      const results = [];
      const seen = new Set();
      const stack = [payload];
      while (stack.length) {
        const node = stack.pop();
        if (!node) continue;
        if (Array.isArray(node)) {
          node.forEach(item => stack.push(item));
          continue;
        }
        if (typeof node === 'object') {
          const handoff = node.handOffFlow;
          if (handoff && typeof handoff === 'object') {
            const id = handoff.handOffTo || handoff.flowId || handoff.flowID || '';
            const name = handoff.handOffToName || handoff.flowName || handoff.name || '';
            const isEntryPoint = !!handoff.isEntryPoint;
            const key = `${id || name}|${isEntryPoint ? 'ep' : 'flow'}`;
            if ((id || name) && !seen.has(key)) {
              seen.add(key);
              results.push({ id, name, isEntryPoint });
            }
          }
          Object.values(node).forEach(value => {
            if (value && typeof value === 'object') stack.push(value);
          });
        }
      }
      return results;
    }

    function resolveHandOffTargets(targets) {
      const flowMap = new Map((flows || []).map(flow => [flow?.id || '', flow]));
      const resolved = [];
      const seen = new Set();
      (targets || []).forEach(target => {
        const id = target?.id || '';
        const mapped = id ? flowMap.get(id) : null;
        const name = mapped ? getFlowName(mapped) : (target?.name || (id ? 'Unknown flow' : 'Unknown'));
        const key = `${id || name}|${target?.isEntryPoint ? 'ep' : 'flow'}`;
        if (!key || seen.has(key)) return;
        seen.add(key);
        resolved.push({ id, name, known: !!mapped, isEntryPoint: !!target?.isEntryPoint });
      });
      return resolved;
    }


    function setDissectState(flowId, status, data, error) {
      if (!flowId) return;
      dissectCache.set(flowId, {
        status,
        data: data || null,
        error: error || '',
      });
    }

    function cleanString(val) {
      if (typeof val !== 'string') return '';
      const trimmed = val.trim();
      if (!trimmed) return '';
      if (isLikelyId(trimmed)) return '';
      if (trimmed.length > 140) return '';
      return trimmed;
    }

    function isLikelyId(value) {
      if (!value) return false;
      const str = String(value).trim();
      return /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(str)
        || /^[0-9a-f]{24,}$/i.test(str);
    }

    function addEntities(value, bucket, opts = {}) {
      if (!value) return;
      if (Array.isArray(value)) {
        value.forEach(item => addEntities(item, bucket, opts));
        return;
      }
      if (typeof value === 'object') {
        addEntities(value.name, bucket, opts);
        addEntities(value.label, bucket, opts);
        if (opts.includeIds) addEntities(value.id, bucket, opts);
        addEntities(value.value, bucket, opts);
        return;
      }
      const cleaned = cleanString(String(value));
      if (!opts.includeIds && isLikelyId(cleaned)) return;
      if (cleaned) bucket.add(cleaned);
    }

    function extractNameFromObject(obj, keys) {
      if (!obj || typeof obj !== 'object') return '';
      for (const key of keys) {
        if (obj[key]) return String(obj[key]);
      }
      return '';
    }

    function collectQueueNames(node, bucket) {
      if (!node || typeof node !== 'object') return;
      const direct = extractNameFromObject(node, [
        'queueName',
        'queueDisplayName',
        'queueLabel',
        'queueTitle',
      ]);
      if (direct) addEntities(direct, bucket);

      const queueObj = node.queue || node.queueRef || node.queueDetails || node.queueTarget || null;
      if (queueObj && typeof queueObj === 'object') {
        const inner = extractNameFromObject(queueObj, ['name', 'displayName', 'label', 'queueName']);
        if (inner) addEntities(inner, bucket);
      }

      Object.entries(node).forEach(([key, value]) => {
        if (!/queue/i.test(key)) return;
        if (/(name|label|display)/i.test(key)) {
          addEntities(value, bucket);
          return;
        }
        if (key === 'queue' && value && typeof value === 'object') {
          const name = extractNameFromObject(value, ['name', 'displayName', 'label', 'queueName']);
          if (name) addEntities(name, bucket);
        }
      });
    }

    function normalizeVarValue(value) {
      if (value == null) return '';
      if (typeof value === 'string') return value;
      if (typeof value === 'number' || typeof value === 'boolean') return String(value);
      if (typeof value === 'object') {
        if ('value' in value) return normalizeVarValue(value.value);
        if ('defaultValue' in value) return normalizeVarValue(value.defaultValue);
        if ('literalValue' in value) return normalizeVarValue(value.literalValue);
        if ('expression' in value) return normalizeVarValue(value.expression);
        try {
          return JSON.stringify(value);
        } catch {
          return String(value);
        }
      }
      return String(value);
    }

    function normalizeScope(value, hint) {
      const raw = (value || hint || '').toString().toLowerCase();
      if (raw.includes('global')) return 'Global';
      if (raw.includes('flow')) return 'Flow';
      return hint || '';
    }

    function addVariableDef(item, scopeHint, store) {
      if (!item || typeof item !== 'object') return;
      const name = item.name || item.variableName || item.key || item.id || '';
      const cleaned = cleanString(String(name));
      if (!cleaned) return;
      const source = item.source || item.variableSource || '';
      const scope = source === 'GLOBAL'
        ? 'Global'
        : normalizeScope(item.scope || item.variableScope || item.context || (item.isGlobal ? 'Global' : ''), scopeHint);
      const value = normalizeVarValue(
        item.value ?? item.defaultValue ?? item.initialValue ?? item.literalValue ?? item.expression ?? ''
      );
      const type = item.type || item.variableType || item.dataType || '';
      const isReportable = item.isReportable ?? item.reportable;
      const isCAD = item.isCAD ?? item.isCad;
      const desktopLabel = item.desktopLabel || item.agentLabel || item.label || '';
      const isExternalized = item.isExternalized ?? item.externalized;
      const target = scope === 'Global' ? store.global : store.flow;
      if (!target.find(entry => entry.name === cleaned)) {
        target.push({
          name: cleaned,
          value,
          scope: scope || 'Flow',
          source,
          type,
          isReportable,
          isCAD,
          desktopLabel,
          isExternalized,
        });
      }
    }

    function collectVariablesFromNode(node, store, scopeHint) {
      if (!node || typeof node !== 'object') return;
      if (Array.isArray(node)) {
        node.forEach(item => collectVariablesFromNode(item, store, scopeHint));
        return;
      }
      Object.entries(node).forEach(([key, value]) => {
        const lowered = key.toLowerCase();
        if (['variables', 'flowvariables', 'globalvariables', 'variabledefinitions', 'flowvariabledefinitions', 'globalvariabledefinitions'].includes(lowered)) {
          const nextHint = lowered.includes('global') ? 'Global' : (lowered.includes('flow') ? 'Flow' : scopeHint);
          if (Array.isArray(value)) {
            value.forEach(item => addVariableDef(item, nextHint, store));
          } else if (value && typeof value === 'object') {
            Object.values(value).forEach(item => addVariableDef(item, nextHint, store));
          }
        }
      });
    }

    function extractVariableDefinitions(payload) {
      const store = { flow: [], global: [] };
      const roots = [
        payload?.variables,
        payload?.flowVariables,
        payload?.globalVariables,
        payload?.flow?.variables,
        payload?.flow?.flowVariables,
        payload?.definitions?.variables,
        payload?.definition?.variables,
        payload?.schema?.variables,
        payload?.variableDefinitions,
      ];
      roots.forEach(root => collectVariablesFromNode(root, store));
      collectVariablesFromNode(payload, store);
      store.flow.sort((a, b) => a.name.localeCompare(b.name));
      store.global.sort((a, b) => a.name.localeCompare(b.name));
      return store;
    }

    function extractQueueActivities(payload) {
      const results = [];
      const seen = new Set();
      const stack = [payload];
      while (stack.length) {
        const node = stack.pop();
        if (!node) continue;
        if (Array.isArray(node)) {
          node.forEach(item => stack.push(item));
          continue;
        }
        if (typeof node !== 'object') continue;

        const props = node.properties || node.props || node;
        const activityName = props?.activityName || node.activityName || '';
        if (String(activityName).toLowerCase() === 'queue-contact') {
          const destinationId = props?.destination || props?.destinationId || props?.queueId || '';
          const destinationName = props?.destination_name || props?.['destination:name'] || props?.destinationName || '';
          const destinationType = props?.destination_type || props?.['destination:type'] || props?.destinationType || '';
          const skillReqs = props?.skills?.requirements || [];
          const skills = Array.isArray(skillReqs)
            ? skillReqs.map(req => req?.skillName || req?.name || req?.skill || '').filter(Boolean)
            : [];
          const cleanedName = cleanString(destinationName) || cleanString(props?.name || node.name || '') || '';
          const typeLabel = destinationType ? formatEnum(destinationType) : 'Unknown';
          const key = `${destinationId || cleanedName}|${typeLabel}|${skills.join(',')}`;
          if (!seen.has(key)) {
            seen.add(key);
            results.push({
              queueId: destinationId,
              name: cleanedName,
              type: typeLabel,
              skills,
            });
          }
        }

        Object.values(node).forEach(value => {
          if (value && typeof value === 'object') stack.push(value);
        });
      }
      return results;
    }

    function extractBlindTransfers(payload) {
      const results = [];
      const stack = [payload];
      while (stack.length) {
        const node = stack.pop();
        if (!node) continue;
        if (Array.isArray(node)) {
          node.forEach(item => stack.push(item));
          continue;
        }
        if (typeof node !== 'object') continue;

        const props = node.properties || node.props || node;
        const activityName = props?.activityName || node.activityName || '';
        if (String(activityName).toLowerCase() === 'blind-transfer') {
          const destination = props?.transfertodn || props?.transferToDn || props?.transferToDN || '';
          const radioName = props?.['transfertodn:radioName'] || props?.transfertodnRadioName || '';
          const name = props?.name || node.name || '';
          if (destination) {
            results.push({
              destination: String(destination),
              mode: String(radioName || '').toLowerCase(),
              name: String(name || ''),
            });
          }
        }

        Object.values(node).forEach(value => {
          if (value && typeof value === 'object') stack.push(value);
        });
      }
      const seen = new Set();
      return results.filter(item => {
        const key = `${item.mode}|${item.destination}|${item.name || ''}`;
        if (seen.has(key)) return false;
        seen.add(key);
        return true;
      });
    }

    function extractFlowArtifacts(payload) {
      const buckets = {
        queues: new Set(),
        skills: new Set(),
        blindTransfers: new Set(),
        entryPoints: new Set(),
        handoffs: new Set(),
      };

      const stack = [payload];
      while (stack.length) {
        const node = stack.pop();
        if (!node) continue;
        if (Array.isArray(node)) {
          node.forEach(item => stack.push(item));
          continue;
        }
        if (typeof node !== 'object') continue;

        collectQueueNames(node, buckets.queues);
        addEntities(node.skillName || node.skillId || node.skillProfileName || node.skillProfileId || node.skill, buckets.skills);
        addEntities(node.skills || node.skillRequirements || node.skillRequirement || node.requiredSkills, buckets.skills);
        addEntities(node.entryPointName || node.entryPointId || node.entryPoint, buckets.entryPoints);

        Object.values(node).forEach(value => {
          if (value && typeof value === 'object') stack.push(value);
        });
      }

      const handoffs = resolveHandOffTargets(extractHandOffTargets(payload));
      handoffs.forEach(target => {
        buckets.handoffs.add({
          label: target?.name || target?.id || 'Unknown',
          isEntryPoint: !!target?.isEntryPoint,
        });
      });

      return {
        queues: Array.from(buckets.queues).sort((a, b) => a.localeCompare(b)),
        skills: Array.from(buckets.skills).sort((a, b) => a.localeCompare(b)),
        blindTransfers: extractBlindTransfers(payload).sort((a, b) => {
          const aKey = `${a?.name || ''} ${a?.destination || ''}`.trim();
          const bKey = `${b?.name || ''} ${b?.destination || ''}`.trim();
          return aKey.localeCompare(bKey);
        }),
        entryPoints: Array.from(buckets.entryPoints).sort((a, b) => a.localeCompare(b)),
        handoffs: Array.from(buckets.handoffs).sort((a, b) => {
          const aLabel = a?.label || '';
          const bLabel = b?.label || '';
          return aLabel.localeCompare(bLabel);
        }),
        variables: extractVariableDefinitions(payload),
        queueDetails: extractQueueActivities(payload),
      };
    }

    function renderDissectSection(title, items, emptyLabel, hintText) {
      const list = items || [];
      const hint = hintText ? `<span class="dissectHint">${escapeHtml(hintText)}</span>` : '';
      if (!list.length) {
        return `
          <div class="dissectSection">

          </div>
        `;
      }
      return `
        <div class="dissectSection">
          <h3>${escapeHtml(title)} <span class="dissectCount">${list.length}</span>${hint}</h3>
          <div class="dissectItems">
            ${list.map(item => `<span class="dissectTag">${escapeHtml(item)}</span>`).join('')}
          </div>

          <div class="dissectItems" style="flex-direction:column; align-items:stretch; gap:8px;">
            ${list.map(item => {

    function renderQueueSection(items) {

      if (!list.length) {
        return `
          <div class="dissectSection">

      return `
        <div class="dissectSection">
          <h3>Queues <span class="dissectCount">${list.length}</span></h3>
          <div class="dissectItems" style="flex-direction:column; align-items:stretch; gap:10px;">
            ${list.map(item => {
              const detail = item.detail || null;
              const queueName = detail?.name || item.name || item.queueId || 'Queue';
              const routingRaw = detail?.routingType || detail?.queueRoutingType || item.type || '';
              const routing = routingRaw ? formatEnum(routingRaw) : 'Unknown';
              const detailSkills = detail?.queueSkillRequirements || [];
              const queueSkills = detailSkills.length
                ? detailSkills.map(req => {
                    const cond = String(req.condition || '').toUpperCase();
                    const condLabel = cond === 'GTE'
                      ? '>='
                      : (cond === 'LTE' ? '<=' : (cond === 'IS' ? 'is' : (req.condition || '')));
                    const typeLabel = req.skillType ? formatEnum(req.skillType) : 'Skill';
                    const value = req.skillValue ?? '';
                    const detailLine = condLabel === '>=' || condLabel === '<='
                      ? `${typeLabel} ${condLabel} ${value}`.trim()
                      : `${typeLabel} ${condLabel}${condLabel ? ':' : ''} ${value}`.trim();
                    return {
                      name: req.skillName || req.skillId || 'Skill',
                      detail: detailLine,
                    };
                  })
                : (item.skills || []).map(skill => ({ name: skill, detail: '' }));
              const routingType = detail?.queueRoutingType || '';
              const teamNames = (item.teams || []).map(team => team?.name || '').filter(Boolean);
              const agents = item.agentsResolved || [];
              const agentLabel = agents.length ? `View agents (${agents.length})` : 'View agents';
              const skills = queueSkills.length
                ? queueSkills.map(entry => {

                    return `<span class="dissectTag">${escapeHtml(label)}</span>`;

                : (routingType === 'AGENT_BASED'
                  ? [

                          : ['<span class="muted">None</span>']),
                        `</div>`,
                        `</div>`
                      ].join('')
                    : '<span class="muted">No skills</span>'));
              return `
                <div class="dissectDetailCard" style="padding:10px 12px;">

                  <div class="dissectDetailMeta">${escapeHtml(routing)}</div>
                  <div class="dissectItems">${skills}</div>

    function openAgentDetailModal(queueItem) {

      const detail = queueItem?.detail || {};
      const queueName = detail?.name || queueItem?.name || queueItem?.queueId || 'Queue';
      const routingRaw = detail?.routingType || detail?.queueRoutingType || '';

    async function analyzeFlowDissect(flowId, options = {}) {
      if (!flowId) return;
      const token = getToken();
      if (!token) {
        window.location.href = '../../index.html';
        return;
      }
      const existing = dissectCache.get(flowId);
      if (existing?.status === 'ready' && !options.force) {
        openDissectModal(flowId);
        return;
      }
      setDissectState(flowId, 'loading');
      if (!options.silent) {
        openDissectModal(flowId);
      }
      try {
        const payload = await fetchFlowExportJson(flowId, token);
        const data = extractFlowArtifacts(payload);
        const queueItems = data.queueDetails || [];
        const ids = Array.from(new Set(queueItems.map(item => item.queueId).filter(Boolean)));
        if (ids.length && currentOrgId) {
          if (options.force) {
            ids.forEach(id => queueDetailCache.delete(id));
          }
          const fetches = ids.map(async (queueId) => {
            if (queueDetailCache.has(queueId)) return;
            try {
              const url = `https://api.wxcc-us1.cisco.com/organization/${encodeURIComponent(currentOrgId)}/v2/contact-service-queue/${encodeURIComponent(queueId)}`;
              const res = await fetch(url, { headers: { Authorization: `Bearer ${token}` } });
              if (!res.ok) return;
              const detail = await res.json();
              queueDetailCache.set(queueId, detail);
            } catch {
              // Ignore queue detail failures.
            }
          });
          await Promise.all(fetches);
          const resolvedQueues = queueItems.map(item => ({
            ...item,
            detail: item.queueId ? queueDetailCache.get(item.queueId) : null,
          }));
          const teamIds = new Set();
          resolvedQueues.forEach(item => {
            const groups = item.detail?.callDistributionGroups || [];
            groups.forEach(group => {
              const agents = group?.agentGroups || [];
              agents.forEach(agent => {
                if (agent?.teamId) teamIds.add(agent.teamId);
              });
            });
          });
          const teamIdList = Array.from(teamIds);
          if (teamIdList.length) {
            if (options.force) {
              teamIdList.forEach(id => teamDetailCache.delete(id));
            }
            const teamFetches = teamIdList.map(async (teamId) => {
              if (teamDetailCache.has(teamId)) return;
              try {
                const url = `https://api.wxcc-us1.cisco.com/organization/${encodeURIComponent(currentOrgId)}/v2/team?filter=${encodeURIComponent(`id==\"${teamId}\"`)}`;
                const res = await fetch(url, { headers: { Authorization: `Bearer ${token}` } });
                if (!res.ok) return;
                const payload = await res.json();
                const team = Array.isArray(payload?.data) ? payload.data[0] : null;
                if (team?.id) teamDetailCache.set(teamId, team);
              } catch {
                // Ignore team detail failures.
              }
            });
            await Promise.all(teamFetches);
          }
          const agentIds = new Set();
          resolvedQueues.forEach(item => {
            const agents = item.detail?.agents || [];
            agents.forEach(agent => {
              if (agent?.id) agentIds.add(agent.id);
            });
          });
          const agentIdList = Array.from(agentIds);
          if (agentIdList.length) {
            if (options.force) {
              agentIdList.forEach(id => userDetailCache.delete(id));
            }
            const userFetches = agentIdList.map(async (agentId) => {
              if (userDetailCache.has(agentId)) return;
              try {
                const url = `https://api.wxcc-us1.cisco.com/organization/${encodeURIComponent(currentOrgId)}/v2/user?filter=${encodeURIComponent(`id==\"${agentId}\"`)}`;
                const res = await fetch(url, { headers: { Authorization: `Bearer ${token}` } });
                if (!res.ok) return;
                const payload = await res.json();
                const user = Array.isArray(payload?.data) ? payload.data[0] : null;
                if (user?.id) userDetailCache.set(agentId, user);
              } catch {
                // Ignore user detail failures.
              }
            });
            await Promise.all(userFetches);
          }
          data.queueDetails = resolvedQueues.map(item => {
            const groups = item.detail?.callDistributionGroups || [];
            const teams = [];
            groups.forEach(group => {
              const agents = group?.agentGroups || [];
              agents.forEach(agent => {
                if (!agent?.teamId) return;
                const team = teamDetailCache.get(agent.teamId);
                if (team) teams.push(team);
              });
            });
            const deduped = [];
            const seen = new Set();
            teams.forEach(team => {
              if (seen.has(team.id)) return;
              seen.add(team.id);
              deduped.push(team);
            });
            const agents = [];
            const agentList = item.detail?.agents || [];
            agentList.forEach(agent => {
              if (!agent?.id) return;
              const user = userDetailCache.get(agent.id);
              if (user) agents.push(user);
            });
            return {
              ...item,
              detail: item.queueId ? queueDetailCache.get(item.queueId) : null,
              teams: deduped,
              agentsResolved: agents,
            };
          });
        }
        setDissectState(flowId, 'ready', data);
      } catch (err) {
        setDissectState(flowId, 'error', null, err.message || 'Scan failed');
      } finally {
        if (!options.silent && dissectActiveId === flowId) {
          openDissectModal(flowId);
        }
      }
    }

    function updatePills(filteredCount) {

    function isFiltersActive() {
      return ['name', 'description', 'channels', 'modifiedBy'].some(key => {
        const values = filterValues[key] || [];
        const selected = filterSelections[key] || new Set();
        return values.length && selected.size !== values.length;
      });
    }

    function getFlowSearchText(flow) {
      const flowId = flow?.id || '';
      const name = getFlowName(flow);
      const description = flow?.description || flow?.comment || '';
      const modifiedBy = flow?.lastModifiedBy || flow?.createdBy || '';
      const version = flow?.version ?? '';
      const channels = flow?.id ? formatChannelsForExport(flow.id) : '';
      return [
        name,
        flowId,
        description,
        modifiedBy,
        String(version),
        channels,
      ]
        .filter(value => value !== null && value !== undefined && String(value).trim() !== '')
        .join(' ')
        .toLowerCase();
    }

    function applySearch(list) {
      if (!searchTerm) return list;
      const term = searchTerm.toLowerCase();
      return list.filter(flow => getFlowSearchText(flow).includes(term));
    }

    function applyChannelFilter(list) {
      return list.filter(flow => {
        return ['name', 'description', 'channels', 'modifiedBy'].every(key => {
          const available = filterValues[key] || [];
          if (!available.length) return true;
          const selected = filterSelections[key];
          if (!selected || selected.size === 0) return false;
          if (key === 'channels') {
            const flowId = flow?.id || '';
            const items = flowId ? (flowChannelMap.get(flowId) || []) : [];
            if (!items.length) {
              return selected.has(CHANNEL_NONE_TOKEN);
            }
            return items.some(item => selected.has(item.name));
          }
          let value = '';
          if (key === 'name') value = getFlowName(flow);
          if (key === 'description') value = getFlowDescription(flow);
          if (key === 'modifiedBy') value = getModifiedBy(flow);
          const token = value ? value : FILTER_BLANK_TOKEN;
          return selected.has(token);
        });
      });
    }

    function sortFlows(list) {
      const sorted = [...list];
      const dir = sortDir === 'asc' ? 1 : -1;
      sorted.sort((a, b) => {
        let aVal = '';
        let bVal = '';
        if (sortKey === 'name') {
          aVal = getFlowName(a);
          bVal = getFlowName(b);
        } else if (sortKey === 'modifiedBy') {
          aVal = getModifiedBy(a);
          bVal = getModifiedBy(b);
        } else if (sortKey === 'modifiedDate') {
          aVal = a?.lastModifiedTime || a?.lastModifiedAt || a?.lastModifiedDate || a?.modifiedTime || a?.modifiedAt || a?.updatedAt || a?.updatedOn || a?.lastUpdatedTime || 0;
          bVal = b?.lastModifiedTime || b?.lastModifiedAt || b?.lastModifiedDate || b?.modifiedTime || b?.modifiedAt || b?.updatedAt || b?.updatedOn || b?.lastUpdatedTime || 0;
        }
        if (sortKey === 'modifiedDate') {
          const aNum = Number(aVal) || new Date(aVal).getTime() || 0;
          const bNum = Number(bVal) || new Date(bVal).getTime() || 0;
          return (aNum - bNum) * dir;
        }
        return String(aVal).localeCompare(String(bVal)) * dir;
      });
      return sorted;
    }

    function extractFlowList(data) {
      return Array.isArray(data) ? data : (data?.items || data?.data || data?.flows || []);

    function getTotalPages(data, pageSize) {
      const total = data?.total || data?.totalCount || data?.count || data?.meta?.totalCount || data?.meta?.total || 0;
      const size = data?.pageSize || data?.size || data?.meta?.pageSize || pageSize;
      if (!total || !size) return 0;
      return Math.ceil(total / size);
    }

    function getNextPageUrl(data) {
      return data?.links?.next || data?.next || data?.meta?.next || '';
    }

    function buildFlowChannelMap() {
      flowChannelMap = new Map();
      const versionToBase = new Map();

      (flows || []).forEach(flow => {
        const baseId = flow?.id;
        if (baseId) versionToBase.set(baseId, baseId);
        const tags = flow?.tags || [];
        tags.forEach(tag => {
          const versionId = tag?.flowVersionId || tag?.flowVersionID;
          if (versionId) versionToBase.set(versionId, baseId);
        });
      });

      (entryPoints || []).forEach(entry => {
        const flowId = getFlowId(entry);
        if (!flowId) return;
        const baseId = versionToBase.get(flowId) || flowId;
        if (!baseId) return;
        if (!flowChannelMap.has(baseId)) flowChannelMap.set(baseId, []);
        flowChannelMap.get(baseId).push({
          name: entry?.name || 'Unnamed entry point',
          channelType: formatEnum(getChannelType(entry)) || 'Unknown',
          dialNumbers: dialNumberLookup[entry?.name] || [],
        });
      });
    }

    function buildFilterValues() {
      const values = {
        name: new Set(),
        description: new Set(),
        channels: new Set(),
        modifiedBy: new Set(),
      };
      let hasBlankName = false;
      let hasBlankDesc = false;
      let hasBlankModified = false;
      flows.forEach(flow => {
        const name = getFlowName(flow);
        const desc = getFlowDescription(flow);
        const mod = getModifiedBy(flow);
        if (name) values.name.add(name); else hasBlankName = true;
        if (desc) values.description.add(desc); else hasBlankDesc = true;
        if (mod) values.modifiedBy.add(mod); else hasBlankModified = true;
        const items = flowChannelMap.get(flow?.id || '') || [];
        if (!items.length) {
          values.channels.add(CHANNEL_NONE_TOKEN);
        } else {
          items.forEach(item => {
            if (item?.name) values.channels.add(item.name);
          });
        }
      });

      filterValues.name = [...values.name].sort((a, b) => a.localeCompare(b));
      filterValues.description = [...values.description].sort((a, b) => a.localeCompare(b));
      filterValues.modifiedBy = [...values.modifiedBy].sort((a, b) => a.localeCompare(b));
      filterValues.channels = [...values.channels].sort((a, b) => {
        if (a === CHANNEL_NONE_TOKEN) return -1;
        if (b === CHANNEL_NONE_TOKEN) return 1;
        return a.localeCompare(b);
      });

      if (hasBlankName) filterValues.name.unshift(FILTER_BLANK_TOKEN);
      if (hasBlankDesc) filterValues.description.unshift(FILTER_BLANK_TOKEN);
      if (hasBlankModified) filterValues.modifiedBy.unshift(FILTER_BLANK_TOKEN);

      ['name', 'description', 'channels', 'modifiedBy'].forEach(key => {
        const current = filterSelections[key];
        if (!current || current.size === 0) {
          filterSelections[key] = new Set(filterValues[key]);
          return;
        }
        filterSelections[key] = new Set(
          [...current].filter(val => filterValues[key].includes(val))
        );
      });
    }

    function renderFilterButton(key) {
      return `
        <button class="filterIconBtn" data-filter-btn="${key}" title="Filter ${escapeAttr(key)}" aria-label="Filter ${escapeAttr(key)}">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M3 5h18l-7 8v5l-4 2v-7L3 5z"></path>
          </svg>
        </button>
        <div class="filterPopover" data-filter-popover="${key}">
          <input class="filterSearch" data-filter-search="${key}" type="text" placeholder="Search..." value="${escapeAttr(filterSearchTerms[key] || '')}" />
          <div class="filterList" data-filter-list="${key}"></div>
          <div class="filterMeta" data-filter-summary="${key}"></div>
        </div>
      `;
    }

    function formatFilterLabel(key, value) {
      if (value === FILTER_BLANK_TOKEN) return '(Blank)';
      if (key === 'channels' && value === CHANNEL_NONE_TOKEN) return '(No channels)';
      return value;
    }

    function renderFilterPopover(key) {
      const listEl = flowListEl.querySelector(`[data-filter-list="${key}"]`);
      const summaryEl = flowListEl.querySelector(`[data-filter-summary="${key}"]`);
      if (!listEl || !summaryEl) return;
      const term = (filterSearchTerms[key] || '').toLowerCase();
      const values = filterValues[key] || [];
      const filteredValues = values.filter(val => {
        const label = formatFilterLabel(key, val);
        return label.toLowerCase().includes(term);
      });
      const selected = filterSelections[key];
      const allSelected = selected && selected.size === values.length;
      const rows = [
        `
          <label class="filterItem">
            <input type="checkbox" data-filter-key="${key}" data-filter-value="__ALL__" ${allSelected ? 'checked' : ''} />
            <span>Select All</span>
          </label>
        `,
        ...filteredValues.map(val => {
          const label = formatFilterLabel(key, val);
          const checked = selected.has(val);
          return `
            <label class="filterItem">
              <input type="checkbox" data-filter-key="${key}" data-filter-value="${escapeAttr(val)}" ${checked ? 'checked' : ''} />
              <span>${escapeHtml(label)}</span>
            </label>
          `;
        }),
      ];
      listEl.innerHTML = rows.join('');
      summaryEl.textContent = allSelected
        ? `All ${values.length} values selected`
        : `${selected.size} of ${values.length} values selected`;
    }

    function setFilterValue(key, value, checked) {
      if (value === '__ALL__') {
        filterSelections[key] = checked ? new Set(filterValues[key]) : new Set();
        renderFilterPopover(key);
        renderFlows();
        return;
      }
      if (checked) {
        filterSelections[key].add(value);
      } else {
        filterSelections[key].delete(value);
      }
      renderFilterPopover(key);
      renderFlows();
    }

    function formatDialNumbers(dialNumbers) {
      return (dialNumbers || [])
        .map(item => item?.dialledNumber || item?.extension || '')
        .filter(Boolean);
    }

    function renderFlowChannels(flowId) {
      const items = flowChannelMap.get(flowId) || [];
      if (!items.length) return '<span class="muted">No channels</span>';
      const maxVisible = 4;
      const visible = items.slice(0, maxVisible);
      const hasMore = items.length > maxVisible;
      return `
        <div class="channelList">
          ${visible.map(item => renderChannelItemHtml(item)).join('')}
          ${hasMore ? `<button class="rowBtn channelMoreBtn" type="button" data-show-more-channels="${escapeAttr(flowId)}">Show more (${items.length - maxVisible})</button>` : ''}
        </div>

    async function fetchEntryPoints(bearer, orgId) {
      const url = ENTRY_POINT_ENDPOINT(orgId);
      try {
        const res = await fetch(url, {
          method: 'GET',
          headers: { Authorization: `Bearer ${bearer}` },
        });
        const data = await res.json();
        const list = data?.data || data?.items || data?.entryPoints || data?.resources || [];
        return Array.isArray(list) ? list : [];
      } catch (err) {
        console.warn('Failed to load entry points:', err.message);
        return [];
      }
    }

    async function fetchDialNumbers(bearer, orgId) {
      dialNumberLookup = {};
      try {
        const res = await fetch(DIAL_NUMBER_ENDPOINT(orgId), {
          method: 'GET',
          headers: { Authorization: `Bearer ${bearer}` },
        });
        if (!res.ok) return;
        const data = await res.json();
        const dialNumbers = data?.resources || [];
        dialNumbers.forEach(dial => {
          const epName = dial?.entryPointName;
          if (!epName) return;
          if (!dialNumberLookup[epName]) {
            dialNumberLookup[epName] = [];
          }
          dialNumberLookup[epName].push({
            dialledNumber: dial?.dialledNumber || null,
            extension: dial?.extension || null,
            region: dial?.region || '',
          });
        });
      } catch (err) {
        console.warn('Failed to load dial numbers:', err.message);
      }
    }

    async function fetchFlows() {
      const bearer = getToken();
      currentOrgId = getOrgIdValue();
      currentProjectId = localStorage.getItem('wxccFlowProjectId') || DEFAULT_PROJECT_ID;

      if (!bearer) {
        window.location.href = '../../index.html';
        return;
      }

      if (!currentOrgId) {
        statusText.textContent = 'Missing org ID. Please sign in again.';
        return;
      }

      statusText.textContent = 'Loading flows and channels...';
      flowListEl.innerHTML = '';

      try {
        const entryPointsPromise = fetchEntryPoints(bearer, currentOrgId);
        const dialNumbersPromise = fetchDialNumbers(bearer, currentOrgId);
        const pageSize = 200;
        let page = 0;
        let allFlows = [];
        const seenIds = new Set();
        let nextUrl = '';
        let totalPages = 0;
        let guard = 0;
        let mode = 'page';

        do {
          const url = nextUrl ? proxyUrl(nextUrl) : FLOW_LIST_ENDPOINT(currentOrgId, currentProjectId, page, pageSize);
          const res = await fetch(url, {
            method: 'GET',
            headers: { Authorization: `Bearer ${bearer}` },
          });
          const data = await res.json();
          const list = extractFlowList(data);
          const items = Array.isArray(list) ? list : [];
          let added = 0;
          items.forEach(flow => {
            const id = flow?.id || '';
            if (id && seenIds.has(id)) return;
            if (id) seenIds.add(id);
            allFlows.push(flow);
            added += 1;
          });
          totalPages = totalPages || getTotalPages(data, pageSize);
          nextUrl = getNextPageUrl(data);
          page += 1;
          guard += 1;

          if (!nextUrl && !totalPages && items.length === 0) break;
          if (!nextUrl && !totalPages && added === 0 && mode === 'page') {
            mode = 'offset';
            page = 0;
            guard = 0;
            nextUrl = '';
            totalPages = 0;
            allFlows = [];
            seenIds.clear();
            break;
          }
        } while ((nextUrl || (totalPages && page < totalPages) || page < 50) && guard < 50);

        if (mode === 'offset') {
          let offset = 0;
          guard = 0;
          while (guard < 50) {
            const base = `https://api.wxcc-us1.cisco.com/flow-store/${encodeURIComponent(currentOrgId)}/project/${encodeURIComponent(currentProjectId)}/flows?offset=${offset}&limit=${pageSize}`;
            const url = proxyUrl(base);
            const res = await fetch(url, {
              method: 'GET',
              headers: { Authorization: `Bearer ${bearer}` },
            });
            const data = await res.json();
            const list = extractFlowList(data);
            const items = Array.isArray(list) ? list : [];
            let added = 0;
            items.forEach(flow => {
              const id = flow?.id || '';
              if (id && seenIds.has(id)) return;
              if (id) seenIds.add(id);
              allFlows.push(flow);
              added += 1;
            });
            if (items.length === 0 || added === 0) break;
            offset += pageSize;
            guard += 1;
          }
        }

        flows = allFlows;
        flows.sort((a, b) => getFlowName(a).localeCompare(getFlowName(b)));
        entryPoints = await entryPointsPromise;
        await dialNumbersPromise;
        buildFlowChannelMap();
        buildFilterValues();
        statusText.textContent = `Loaded ${flows.length} flows and ${entryPoints.length} channels.`;
        renderFlows();
      } catch (err) {
        statusText.textContent = `Failed to load flows: ${err.message}`;
        flowListEl.innerHTML = '<div class="status">Unable to load flows.</div>';
      }
    }

    function downloadBlob(blob, filename) {
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = filename;
      document.body.appendChild(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(link.href), 1000);
    }

    function mapToObject(map) {
      return Array.from(map.entries()).reduce((acc, [key, value]) => {
        acc[key] = value;
        return acc;
      }, {});
    }

    function findActivityMap(payload) {
      const candidates = [
        payload?.activities,
        payload?.activityMap,
        payload?.activityMapping,
        payload?.nodes,
        payload?.process?.activities,
        payload?.flow?.activities,
        payload?.flow?.nodes,
        payload?.definition?.activities,
        payload?.definition?.nodes,
      ].filter(Boolean);

      const isActivityMap = (obj) => {
        if (!obj || typeof obj !== 'object' || Array.isArray(obj)) return false;
        const values = Object.values(obj);
        if (!values.length) return false;
        const sample = values[0];
        return typeof sample === 'object' && (sample.id || sample.name || sample.properties);
      };

      for (const candidate of candidates) {
        if (isActivityMap(candidate)) return candidate;
      }

      let best = null;
      let bestScore = 0;
      const stack = [payload];
      while (stack.length) {
        const node = stack.pop();
        if (!node || typeof node !== 'object') continue;
        if (!Array.isArray(node)) {
          const values = Object.values(node);
          const score = values.reduce((acc, item) => {
            if (item && typeof item === 'object' && (item.id || item.name || item.properties)) return acc + 1;
            return acc;
          }, 0);
          if (score > bestScore && score >= 3) {
            bestScore = score;
            best = node;
          }
        }
        Object.values(node).forEach(value => {
          if (value && typeof value === 'object') stack.push(value);
        });
      }
      return best;
    }

    function findLinks(payload) {
      const candidates = [
        payload?.links,
        payload?.process?.links,
        payload?.flow?.links,
        payload?.definition?.links,
        payload?.graph?.links,
      ].filter(Boolean);
      for (const candidate of candidates) {
        if (Array.isArray(candidate) && candidate.length && candidate[0]?.sourceActivityId) return candidate;
      }
      const stack = [payload];
      while (stack.length) {
        const node = stack.pop();
        if (!node || typeof node !== 'object') continue;
        if (Array.isArray(node) && node.length && node[0]?.sourceActivityId) return node;
        Object.values(node).forEach(value => {
          if (value && typeof value === 'object') stack.push(value);
        });
      }
      return [];
    }

    function filterLinksByIds(links, idSet) {
      if (!idSet || !idSet.size) return [];
      return (links || []).filter(link => idSet.has(link?.sourceActivityId) && idSet.has(link?.targetActivityId));
    }

    function collectEventNodes(payload) {
      const found = new Map();
      const stack = [payload];
      while (stack.length) {
        const node = stack.pop();
        if (!node || typeof node !== 'object') continue;
        if (!Array.isArray(node)) {
          const id = node.id;
          const activityName = String(node?.properties?.activityName || '').toLowerCase();
          if (id && activityName === 'event') {
            found.set(id, node);
          }
        }
        Object.values(node).forEach(value => {
          if (value && typeof value === 'object') stack.push(value);
        });
      }
      return Object.fromEntries(found.entries());
    }

    function collectAllNodes(payload) {
      const found = new Map();
      const stack = [payload];
      while (stack.length) {
        const node = stack.pop();
        if (!node || typeof node !== 'object') continue;
        if (!Array.isArray(node)) {
          const id = node.id;
          if (id && (node.name || node.properties)) {
            found.set(id, node);
          }
        }
        Object.values(node).forEach(value => {
          if (value && typeof value === 'object') stack.push(value);
        });
      }
      return Object.fromEntries(found.entries());
    }

    function collectEventFlows(payload) {
      const eventActivities = {};
      const eventLinks = [];
      const eventsMap = payload?.eventFlows?.eventsMap || {};
      Object.values(eventsMap).forEach(entry => {
        const activities = entry?.process?.activities || {};
        const links = Array.isArray(entry?.process?.links) ? entry.process.links : [];
        Object.values(activities).forEach(node => {
          if (node?.id) eventActivities[node.id] = node;
        });
        links.forEach(link => {
          if (link?.sourceActivityId && link?.targetActivityId) eventLinks.push(link);
        });
      });
      return { eventActivities, eventLinks };
    }

    function buildFlowSections(activityMap, links, payload) {
      const baseMap = activityMap || {};
      const collectedEvents = collectEventNodes(payload);
      const allNodes = collectAllNodes(payload);
      const { eventActivities, eventLinks } = collectEventFlows(payload);
      const nodeMap = { ...baseMap, ...allNodes, ...eventActivities, ...collectedEvents };
      const eventStartIds = new Set();
      Object.values(nodeMap).forEach(node => {
        if (!node || !node.id) return;
        const activityName = String(node?.properties?.activityName || '').toLowerCase();
        if (activityName === 'event') eventStartIds.add(node.id);
      });
      if (!eventStartIds.size) {
        const mainIds = new Set(Object.keys(baseMap || {}));
        return {
          mainMap: baseMap,
          eventMap: eventActivities,
          mainLinks: filterLinksByIds(links, mainIds),
          eventLinks: eventLinks,
        };
      }
      const adjacency = new Map();
      const combinedLinks = [...(links || []), ...eventLinks];
      combinedLinks.forEach(link => {
        const src = link?.sourceActivityId;
        const tgt = link?.targetActivityId;
        if (!src || !tgt) return;
        if (!adjacency.has(src)) adjacency.set(src, []);
        adjacency.get(src).push(tgt);
      });
      const eventIds = new Set(eventStartIds);
      const queue = [...eventStartIds];
      while (queue.length) {
        const id = queue.shift();
        const targets = adjacency.get(id) || [];
        targets.forEach(targetId => {
          if (eventIds.has(targetId)) return;
          if (!nodeMap[targetId]) return;
          eventIds.add(targetId);
          queue.push(targetId);
        });
      }
      const eventMap = {};
      eventIds.forEach(id => {
        if (nodeMap[id]) eventMap[id] = nodeMap[id];
      });
      const mainMap = {};
      Object.values(baseMap || {}).forEach(node => {
        if (!node || !node.id) return;
        if (!eventIds.has(node.id)) mainMap[node.id] = node;
      });
      const mainIds = new Set(Object.keys(mainMap));
      return {
        mainMap,
        eventMap: Object.keys(eventActivities).length ? eventActivities : eventMap,
        mainLinks: filterLinksByIds(links, mainIds),
        eventLinks: eventLinks.length ? eventLinks : filterLinksByIds(links, eventIds),
      };
    }

    function extractDiagramWidgetPoints(widgets) {
      const points = new Map();
      Object.entries(widgets || {}).forEach(([id, widget]) => {
        if (!widget || typeof widget !== 'object') return;
        if (widget.widgetType && widget.widgetType !== 'activity') return;
        const x = Number(widget?.point?.x);
        const y = Number(widget?.point?.y);
        if (!Number.isFinite(x) || !Number.isFinite(y)) return;
        points.set(id, { x, y });
      });
      return points;
    }

    function extractDiagramLinkWidgets(widgets) {
      const links = new Map();
      Object.entries(widgets || {}).forEach(([id, widget]) => {
        if (!widget || typeof widget !== 'object') return;
        if (widget.widgetType !== 'link') return;
        links.set(id, {
          sourcePoint: {
            x: Number(widget?.sourcePort?.point?.x),
            y: Number(widget?.sourcePort?.point?.y),
          },
          targetPoint: {
            x: Number(widget?.targetPort?.point?.x),
            y: Number(widget?.targetPort?.point?.y),
          },
          controlPoints: Array.isArray(widget?.properties?.points)
            ? widget.properties.points.map(point => ({
                x: Number(point?.x),
                y: Number(point?.y),
              })).filter(point => Number.isFinite(point.x) && Number.isFinite(point.y))
            : [],
        });
      });
      return links;
    }

    function mergeDiagramWidgetPoints(target, source) {
      if (!(target instanceof Map) || !(source instanceof Map)) return target;
      source.forEach((point, id) => {
        if (!target.has(id)) target.set(id, point);
      });
      return target;
    }

    function mergeDiagramLinkWidgets(target, source) {
      if (!(target instanceof Map) || !(source instanceof Map)) return target;
      source.forEach((linkWidget, id) => {
        if (!target.has(id)) target.set(id, linkWidget);
      });
      return target;
    }

    function filterDiagramWidgetPoints(pointMap, idSet) {
      const filtered = new Map();
      if (!(pointMap instanceof Map) || !idSet?.size) return filtered;
      idSet.forEach(id => {
        const point = pointMap.get(id);
        if (point) filtered.set(id, point);
      });
      return filtered;
    }

    function collectDiagramWidgetPointMaps(payload) {
      const mainWidgetPoints = extractDiagramWidgetPoints(payload?.diagram?.widgets);
      const mainLinkWidgets = extractDiagramLinkWidgets(payload?.diagram?.widgets);
      const eventWidgetPoints = new Map();
      const eventLinkWidgets = new Map();
      const eventsMap = payload?.eventFlows?.eventsMap || {};
      Object.values(eventsMap).forEach(entry => {
        mergeDiagramWidgetPoints(eventWidgetPoints, extractDiagramWidgetPoints(entry?.diagram?.widgets));
        mergeDiagramLinkWidgets(eventLinkWidgets, extractDiagramLinkWidgets(entry?.diagram?.widgets));
      });
      return { mainWidgetPoints, eventWidgetPoints, mainLinkWidgets, eventLinkWidgets };
    }

    const FIXED_PROMPT_NODE_WIDTH = 320;
    const FIXED_PROMPT_TEXT_CHARS = Math.floor((FIXED_PROMPT_NODE_WIDTH - 30) / 7);
    const FIXED_PROMPT_ACTIVITIES = new Set(['play-message', 'ivr-menu']);
    const DEFAULT_NODE_WIDTH = 260;
    const MAX_NODE_WIDTH = 1400;
    const NODE_PADDING_X = 52;
    const NODE_PADDING_Y = 26;
    const DEFAULT_MAX_LINES = 0;
    const DEFAULT_TTS_WRAP_CHARS = 56;
    const DEFAULT_HTTP_WRAP_CHARS = 120;
    const DIAGRAM_NODE_WIDTH = 380;
    const DIAGRAM_OUTPUT_COLUMN_MIN = 64;
    const DIAGRAM_OUTPUT_COLUMN_MAX = 96;
    const DIAGRAM_OUTPUT_COLUMN_GAP = 2;
    const DIAGRAM_CHOICE_BODY_GUTTER = 2;
    const EXPLICIT_LAYOUT_COLUMN_CLUSTER = 140;
    const EXPLICIT_LAYOUT_ROW_CLUSTER = 90;
    const EXPLICIT_LAYOUT_COLUMN_GAP = 96;
    const EXPLICIT_LAYOUT_ROW_GAP = 84;
    const EXPLICIT_LAYOUT_COLUMN_JITTER = 18;
    const EXPLICIT_LAYOUT_ROW_JITTER = 24;

    function clusterCoordinateValues(values, threshold) {
      const numericValues = [...(values || [])]
        .map(value => Number(value))
        .filter(value => Number.isFinite(value))
        .sort((a, b) => a - b);
      const clusters = [];
      numericValues.forEach(value => {
        const current = clusters[clusters.length - 1];
        if (!current || Math.abs(value - current.max) > threshold) {
          clusters.push({ min: value, max: value, sum: value, count: 1 });
          return;
        }
        current.max = value;
        current.sum += value;
        current.count += 1;
      });
      return clusters.map(cluster => cluster.sum / cluster.count);
    }

    function findNearestClusterIndex(value, clusters) {
      const numericValue = Number(value);
      if (!Number.isFinite(numericValue) || !Array.isArray(clusters) || !clusters.length) return -1;
      let bestIndex = 0;
      let bestDistance = Infinity;
      clusters.forEach((center, index) => {
        const distance = Math.abs(numericValue - center);
        if (distance < bestDistance) {
          bestDistance = distance;
          bestIndex = index;
        }
      });
      return bestIndex;
    }

    function buildExplicitLayoutNodes(nodes, widgetPointMap, links, linkWidgetMap) {
      const seededNodes = (nodes || []).map(node => ({
        ...node,
        _rawPoint: widgetPointMap.get(node.id) || null,
      }));
      const explicitNodes = seededNodes.filter(node => node._rawPoint);
      if (!explicitNodes.length) return seededNodes.map(({ _rawPoint, ...node }) => node);

      // Use point.y from the flow designer directly — this is the authoritative
      // position and gives correct top-to-bottom ordering within columns.
      explicitNodes.forEach(node => {
        node._rowSeedY = node._rawPoint.y;
      });

      const columnCenters = clusterCoordinateValues(
        explicitNodes.map(node => node._rawPoint.x),
        EXPLICIT_LAYOUT_COLUMN_CLUSTER
      );
      const rowCenters = clusterCoordinateValues(
        explicitNodes.map(node => node._rowSeedY),
        EXPLICIT_LAYOUT_ROW_CLUSTER
      );

      const columnWidths = Array.from({ length: columnCenters.length }, () => 0);
      const rowHeights = Array.from({ length: rowCenters.length }, () => 0);
      explicitNodes.forEach(node => {
        const col = findNearestClusterIndex(node._rawPoint.x, columnCenters);
        const row = findNearestClusterIndex(node._rowSeedY, rowCenters);
        node._explicitCol = Math.max(0, col);
        node._explicitRow = Math.max(0, row);
        columnWidths[node._explicitCol] = Math.max(columnWidths[node._explicitCol], Number(node?.data?.width) || DIAGRAM_NODE_WIDTH);
        rowHeights[node._explicitRow] = Math.max(rowHeights[node._explicitRow], Number(node?.data?.height) || 120);
      });

      const columnOffsets = [];
      let runningX = 0;
      columnWidths.forEach((width, index) => {
        columnOffsets[index] = runningX;
        runningX += width + EXPLICIT_LAYOUT_COLUMN_GAP;
      });

      // Recompute row heights to account for cells that have multiple stacked nodes,
      // so the next row's offset starts below the tallest stacked cell in the current row.
      const stackGap = Math.max(24, EXPLICIT_LAYOUT_ROW_GAP / 2);
      const cellStackedHeights = new Map();
      explicitNodes.forEach(node => {
        const cellKey = `${node._explicitCol}:${node._explicitRow}`;
        const h = Number(node?.data?.height) || 120;
        cellStackedHeights.set(cellKey, (cellStackedHeights.get(cellKey) || 0) + h + stackGap);
      });
      cellStackedHeights.forEach((totalH, cellKey) => {
        const row = Number(cellKey.split(':')[1]);
        if (Number.isFinite(row)) rowHeights[row] = Math.max(rowHeights[row], totalH - stackGap);
      });

      const rowOffsets = [];
      let runningY = 0;
      rowHeights.forEach((height, index) => {
        rowOffsets[index] = runningY;
        runningY += height + EXPLICIT_LAYOUT_ROW_GAP;
      });

      // Sort nodes within each cell by raw point.y so stacking order matches
      // the original flow designer top-to-bottom positioning.
      seededNodes.sort((a, b) => {
        if (!a._rawPoint && !b._rawPoint) return 0;
        if (!a._rawPoint) return 1;
        if (!b._rawPoint) return -1;
        if (a._explicitCol !== b._explicitCol) return a._explicitCol - b._explicitCol;
        if (a._explicitRow !== b._explicitRow) return a._explicitRow - b._explicitRow;
        return a._rawPoint.y - b._rawPoint.y;
      });

      // Use a per-cell Y accumulator so each stacked node starts immediately after
      // the previous one ends, regardless of individual node heights.
      const cellNextY = new Map();
      const positioned = seededNodes.map(node => {
        if (!node._rawPoint) return node;
        const col = node._explicitCol;
        const row = node._explicitRow;
        const cellKey = `${col}:${row}`;
        const colCenter = columnCenters[col] || node._rawPoint.x;
        const residualX = Math.max(-EXPLICIT_LAYOUT_COLUMN_JITTER, Math.min(EXPLICIT_LAYOUT_COLUMN_JITTER, node._rawPoint.x - colCenter));
        const nodeHeight = Number(node?.data?.height) || 120;
        if (!cellNextY.has(cellKey)) cellNextY.set(cellKey, rowOffsets[row] || 0);
        const y = cellNextY.get(cellKey);
        cellNextY.set(cellKey, y + nodeHeight + stackGap);
        return {
          ...node,
          position: {
            x: (columnOffsets[col] || 0) + residualX,
            y,
          },
        };
      });

      const maxExplicitX = columnOffsets.length
        ? columnOffsets[columnOffsets.length - 1] + (columnWidths[columnWidths.length - 1] || DIAGRAM_NODE_WIDTH)
        : 0;
      const fallbackNodes = positioned.filter(node => !node._rawPoint);
      let fallbackIndex = 0;
      const withFallbacks = positioned.map(node => {
        if (node._rawPoint) return node;
        const col = fallbackIndex % 2;
        const row = Math.floor(fallbackIndex / 2);
        fallbackIndex += 1;
        return {
          ...node,
          position: {
            x: maxExplicitX + EXPLICIT_LAYOUT_COLUMN_GAP + col * (DIAGRAM_NODE_WIDTH + EXPLICIT_LAYOUT_COLUMN_GAP),
            y: row * (140 + EXPLICIT_LAYOUT_ROW_GAP),
          },
        };
      });

      return withFallbacks.map(({ _rawPoint, _rowSeedY, _explicitCol, _explicitRow, ...node }) => node);
    }

    function wrapDiagramLine(line, maxChars) {
      const text = String(line || '').trim();
      const isTtsLine = /^TTS:\s/i.test(text) || /^Prompt:\s*TTS\b/i.test(text);
      const isHttpLine = /^(Method|URL|Content|Body):\s/i.test(text);
      if (!isTtsLine && !isHttpLine) return [text];
      const targetChars = isHttpLine ? DEFAULT_HTTP_WRAP_CHARS : DEFAULT_TTS_WRAP_CHARS;
      const baseChars = Number(maxChars) || 0;
      const wrapChars = Math.max(16, targetChars, baseChars);
      if (text.length <= wrapChars) return [text];
      const words = text.split(/\s+/);
      const lines = [];
      let current = '';
      const pushToken = (token) => {
        let remaining = token;
        while (remaining.length > wrapChars) {
          const chunk = remaining.slice(0, wrapChars - 1);
          remaining = remaining.slice(wrapChars - 1);
          if (current.length) {
            lines.push(current);
            current = '';
          }
          lines.push(`${chunk}-`);
        }
        return remaining;
      };
      words.forEach(word => {
        const safeWord = pushToken(word);
        if (!safeWord) return;
        if (!current.length) {
          current = safeWord;
          return;
        }
        if ((current.length + 1 + safeWord.length) <= wrapChars) {
          current = `${current} ${safeWord}`;
        } else {
          lines.push(current);
          current = safeWord;
        }
      });
      if (current) lines.push(current);
      return lines.length ? lines : [text];
    }

    function wrapAndClampLines(lines, maxChars, maxLines) {
      const wrapped = [];
      lines.forEach(line => wrapped.push(...wrapDiagramLine(line, maxChars)));
      if (!maxLines || wrapped.length <= maxLines) return wrapped;
      const clamped = wrapped.slice(0, maxLines);
      const last = clamped[maxLines - 1];
      clamped[maxLines - 1] = last.length > 3 ? `${last.slice(0, Math.max(0, last.length - 3))}...` : '...';
      return clamped;
    }

    function wrapBodyContentLines(lines, maxChars) {
      const wrapChars = Math.max(16, Number(maxChars) || 0);
      const wrapped = [];
      const paragraphs = [];
      let currentParagraph = '';
      const flushParagraph = () => {
        if (!currentParagraph) return;
        paragraphs.push(currentParagraph);
        currentParagraph = '';
      };
      const startsStructuredLine = (text) => /^[A-Za-z][A-Za-z0-9 /()_-]{0,30}:\s/.test(text);

      (lines || []).forEach(line => {
        const text = String(line || '').trim();
        if (!text) {
          flushParagraph();
          paragraphs.push('');
          return;
        }
        if (!currentParagraph) {
          currentParagraph = text;
          return;
        }
        if (startsStructuredLine(text)) {
          flushParagraph();
          currentParagraph = text;
          return;
        }
        currentParagraph = `${currentParagraph} ${text}`.trim();
      });
      flushParagraph();

      paragraphs.forEach(text => {
        if (!text) {
          wrapped.push('');
          return;
        }
        if (text.length <= wrapChars) {
          wrapped.push(text);
          return;
        }
        const words = text.split(/\s+/);
        let current = '';
        const pushToken = (token) => {
          let remaining = token;
          while (remaining.length > wrapChars) {
            const chunk = remaining.slice(0, wrapChars - 1);
            remaining = remaining.slice(wrapChars - 1);
            if (current.length) {
              wrapped.push(current);
              current = '';
            }
            wrapped.push(`${chunk}-`);
          }
          return remaining;
        };
        words.forEach(word => {
          const safeWord = pushToken(word);
          if (!safeWord) return;
          if (!current.length) {
            current = safeWord;
            return;
          }
          if ((current.length + 1 + safeWord.length) <= wrapChars) {
            current = `${current} ${safeWord}`;
          } else {
            wrapped.push(current);
            current = safeWord;
          }
        });
        if (current) wrapped.push(current);
      });
      return wrapped;
    }
