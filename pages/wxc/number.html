<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <title>Webex Calling - Numbers</title>
  <link rel="icon" type="image/png" href="../../assets/images/Orbit_Icon-192.png">
  <link rel="stylesheet" href="../../assets/css/theme.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    main { padding:32px 0 80px; display:flex; justify-content:flex-start; }
    .actionsRow { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
    .actionsRow .spacer { flex:1; }
    .searchInput { min-width:260px; flex:0 1 340px; }
    .numberTable { margin-top:16px; border:1px solid var(--border); border-radius:14px; overflow:hidden; box-shadow:var(--shadow); }
    .numberHeader, .numberRow { display:grid; grid-template-columns:minmax(220px,1.45fr) minmax(150px,.9fr) minmax(180px,1fr) minmax(230px,1.2fr) minmax(140px,.8fr) minmax(220px,1.1fr); align-items:center; }
    .numberHeader { background:var(--panel); color:var(--accent); font-weight:700; font-size:12px; letter-spacing:.01em; }
    .numberHeader .headerCell { position:relative; }
    .numberRow { background:var(--card); border-top:1px solid var(--border); }
    .numberRow:nth-child(even) { background:var(--input); }
    .numberRow:hover { background:rgba(8,172,242,.08); }
    .numberCell { padding:12px; display:flex; align-items:center; gap:8px; min-height:50px; min-width:0; }
    .headerCell { padding:12px; min-height:46px; display:flex; flex-direction:column; gap:6px; align-items:flex-start; justify-content:center; }
    .headerTop .sortBtn { flex:1 1 auto; }
    .sortBtn { display:inline-flex; align-items:center; gap:6px; font-weight:700; background:transparent; border:none; color:inherit; cursor:pointer; padding:0; }
    .sortBtn span { color:var(--muted); font-size:11px; }
    .numPrimary { font-weight:700; color:var(--fg); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; display:block; }
    .numSub, .muted { color:var(--muted); font-size:12px; }
    .stack { display:flex; flex-direction:column; gap:4px; min-width:0; }
    .tags { display:flex; flex-wrap:wrap; gap:6px; }
    .tag { display:inline-flex; align-items:center; padding:3px 8px; border-radius:999px; font-size:11px; font-weight:700; background:rgba(8,172,242,.08); border:1px solid rgba(8,172,242,.18); color:var(--accent); }
    .tag.main { background:rgba(21,157,216,.15); color:#0b6ea7; }
    .tag.warn { background:rgba(245,158,11,.14); color:#b45309; border-color:rgba(245,158,11,.24); }
    .statusDot { width:8px; height:8px; border-radius:50%; background:#10b981; flex:0 0 8px; }
    .statusDot.inactive { background:#94a3b8; }
    .statusDot.warn { background:#f59e0b; }
    .emptyState { padding:18px 12px; color:var(--muted); }
    .locText { color:var(--accent-blue); }
    body.dark-mode .numberRow { background:var(--card); }
    body.dark-mode .numberRow:nth-child(even) { background:var(--panel); }
    body.dark-mode .numberRow:hover { background:rgba(8,172,242,.14); }
    body.dark-mode .tag.main { color:#7dd3fc; }
    @media (max-width:1100px) {
      .numberTable { overflow:auto; }
      .numberHeader, .numberRow { min-width:1180px; }
    }
    @media (max-width:640px) {
      .actionsRow { align-items:stretch; }
      .searchInput, .btn { width:100%; }
    }
  </style>
</head>
<body class="dark-mode">
  <script>if (localStorage.getItem("tpRailExpanded") === "true") document.body.classList.add("tp-rail-expanded");</script>
  <api-tools-header basepath="../../"></api-tools-header>
  <main>
    <div class="wrap wide contentWrap">
      <section class="card">
        <div class="pageHeader">
          <h1>Numbers</h1>
          <p class="lead">Search and filter Webex Calling numbers using the Control Hub numbers view layout.</p>
        </div>
        <div class="actionsRow">
          <input id="searchInput" class="searchInput" type="text" placeholder="Search numbers, owners, extensions, locations..." />
          <span class="pill" id="countPill">0 numbers</span>
          <span class="pill" id="sourcePill">Sample Data</span>
          <div class="spacer"></div>
          <button class="btn secondary" id="refreshBtn" type="button">Refresh</button>
        </div>
        <div class="status" id="statusText"></div>
        <div id="numberList"></div>
      </section>
    </div>
  </main>

  <script src="../../assets/js/components.js"></script>
  <script src="../../assets/js/theme.js"></script>
  <script>
    const cacheKeyBearer = 'authBearer';
    const cacheKeyOrg = 'authOrg';
    const cacheKeyOrgName = 'authOrgName';
    const cacheKeyUser = 'authUserName';
    const LIVE_ENDPOINT = 'https://webexapis.com/v1/telephony/config/numbers';
    const FILTER_BLANK_TOKEN = '__BLANK__';

    const numberListEl = document.getElementById('numberList');
    const searchInput = document.getElementById('searchInput');
    const refreshBtn = document.getElementById('refreshBtn');
    const statusText = document.getElementById('statusText');
    const countPill = document.getElementById('countPill');
    const sourcePill = document.getElementById('sourcePill');

    const samplePayload = JSON.parse(document.getElementById('sampleNumbersData').textContent || '{"phoneNumbers":[]}');

    let numberRows = [];
    let searchTerm = '';
    let sortKey = 'phoneNumber';
    let sortDir = 'asc';
    let activeFilterKey = '';
    let activePopoverState = null;
    const filterKeys = ['phoneNumber', 'extension', 'location', 'assignedTo', 'status', 'type'];
    const filterValues = {
      phoneNumber: [],
      extension: [],
      location: [],
      assignedTo: [],
      status: [],
      type: [],
    };
    const filterSelections = {
      phoneNumber: new Set(),
      extension: new Set(),
      location: new Set(),
      assignedTo: new Set(),
      status: new Set(),
      type: new Set(),
    };
    const filterSearchTerms = {
      phoneNumber: '',
      extension: '',
      location: '',
      assignedTo: '',
      status: '',
      type: '',
    };

    function getToken() {
      return (localStorage.getItem(cacheKeyBearer) || '').trim();
    }

    function getOrg() {
      return localStorage.getItem(cacheKeyOrgName) || localStorage.getItem(cacheKeyOrg) || '';
    }

    function getUser() {
      return localStorage.getItem(cacheKeyUser) || '';
    }

    function escapeHtml(val) {
      return String(val ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function formatEnum(val) {
      if (!val) return '';
      return String(val)
        .split('_')
        .filter(Boolean)
        .map(word => word.charAt(0) + word.slice(1).toLowerCase())
        .join(' ');
    }

    function ownerName(owner) {
      if (!owner) return '';
      const first = owner.firstName || '';
      const last = owner.lastName || '';
      return `${first} ${last}`.trim();
    }

    function normalizeNumber(item, index) {
      const rawOwnerName = ownerName(item.owner);
      const rawState = formatEnum(item.state) || 'Unassigned';
      const rawType = [
        formatEnum(item.phoneNumberType),
        formatEnum(item.includedTelephonyTypes),
      ].filter(Boolean).join(' / ');

      return {
        id: item.phoneNumber || `${item.location?.id || 'loc'}-${item.extension || item.esn || index}`,
        phoneNumber: item.phoneNumber || '',
        extension: item.extension || '',
        esn: item.esn || '',
        location: item.location?.name || '',
        assignedTo: rawOwnerName || 'Unassigned',
        ownerType: formatEnum(item.owner?.type) || '',
        status: rawState,
        type: rawType || 'Extension Only',
        mainNumber: !!item.mainNumber,
        tollFreeNumber: !!item.tollFreeNumber,
        isServiceNumber: !!item.isServiceNumber,
        source: item,
      };
    }

    function getFilterValue(row, key) {
      const value = row[key];
      return value ? String(value) : '';
    }

    function buildFilterValues(rows) {
      filterKeys.forEach(key => {
        const values = new Set();
        rows.forEach(row => {
          const value = getFilterValue(row, key);
          values.add(value || FILTER_BLANK_TOKEN);
        });
        filterValues[key] = Array.from(values).sort((a, b) => {
          if (a === FILTER_BLANK_TOKEN) return 1;
          if (b === FILTER_BLANK_TOKEN) return -1;
          return a.localeCompare(b, undefined, { sensitivity: 'base', numeric: true });
        });
      });
    }

    function applySearch(rows) {
      if (!searchTerm) return rows.slice();
      const needle = searchTerm.toLowerCase();
      return rows.filter(row => {
        const haystack = [
          row.phoneNumber,
          row.extension,
          row.esn,
          row.location,
          row.assignedTo,
          row.ownerType,
          row.status,
          row.type,
        ].join(' ').toLowerCase();
        return haystack.includes(needle);
      });
    }

    function applyFilters(rows) {
      return rows.filter(row => {
        return filterKeys.every(key => {
          const selected = filterSelections[key];
          if (!selected.size) return true;
          const value = getFilterValue(row, key) || FILTER_BLANK_TOKEN;
          return selected.has(value);
        });
      });
    }

    function compareValues(a, b) {
      const aVal = (a ?? '').toString();
      const bVal = (b ?? '').toString();
      return aVal.localeCompare(bVal, undefined, { sensitivity: 'base', numeric: true });
    }

    function applySort(rows) {
      return rows.slice().sort((a, b) => {
        const result = compareValues(getFilterValue(a, sortKey), getFilterValue(b, sortKey));
        return sortDir === 'asc' ? result : result * -1;
      });
    }

    function sortIndicator(key) {
      if (sortKey !== key) return '<span>↕</span>';
      return `<span>${sortDir === 'asc' ? '↑' : '↓'}</span>`;
    }

    function renderFilterButton(key) {
      const active = filterSelections[key].size !== filterValues[key].length ? ' active' : '';
      return `
        <button class="filterIconBtn${active}" type="button" data-filter-btn="${key}" aria-expanded="false" aria-label="Filter ${escapeHtml(key)}">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M22 3H2l8 9v7l4 2v-9l8-9z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <div class="filterPopover" data-filter-popover="${key}"></div>
      `;
    }

    function renderFilterPopover(key) {
      const popover = activePopoverState?.key === key
        ? activePopoverState.popover
        : numberListEl.querySelector(`[data-filter-popover="${key}"]`);
      if (!popover) return;
      const term = (filterSearchTerms[key] || '').trim().toLowerCase();
      const values = (filterValues[key] || []).filter(value => {
        const label = value === FILTER_BLANK_TOKEN ? 'Blank' : value;
        return !term || label.toLowerCase().includes(term);
      });
      popover.innerHTML = `
        <input class="filterSearch" data-filter-search="${key}" type="text" placeholder="Search values..." value="${escapeHtml(filterSearchTerms[key] || '')}">
        <div class="filterList">
          ${values.map(value => {
            const checked = filterSelections[key].has(value) ? 'checked' : '';
            const label = value === FILTER_BLANK_TOKEN ? 'Blank' : value;
            return `
              <label class="filterItem">
                <input type="checkbox" data-filter-key="${key}" data-filter-value="${escapeHtml(value)}" ${checked}>
                <span>${escapeHtml(label)}</span>
              </label>
            `;
          }).join('') || '<div class="filterMeta">No matching values</div>'}
        </div>
        <div class="filterMeta">${filterSelections[key].size} selected</div>
      `;
    }

    function setFilterValue(key, value, checked) {
      if (!filterSelections[key]) return;
      if (checked) {
        filterSelections[key].add(value);
      } else {
        filterSelections[key].delete(value);
      }
      renderFilterPopover(key);
      renderNumbers();
    }

    function positionPopover(btn, popover) {
      window.CXASFloatingFilters?.position(btn, popover);
    }

    function openPopover(key, btn, popover) {
      const nextState = window.CXASFloatingFilters?.open({
        button: btn,
        panel: popover,
        parent: popover.parentElement,
      });
      if (!nextState) return;
      activeFilterKey = key;
      activePopoverState = { key, btn: nextState.button, popover: nextState.panel, parent: nextState.parent };
      renderFilterPopover(key);
      popover.querySelector('.filterSearch')?.focus();
    }

    function closePopover() {
      if (!activePopoverState) return;
      window.CXASFloatingFilters?.close({
        button: activePopoverState.btn,
        panel: activePopoverState.popover,
        parent: activePopoverState.parent,
      });
      activeFilterKey = '';
      activePopoverState = null;
    }

    function statusDotClass(status) {
      const normalized = String(status || '').toLowerCase();
      if (normalized.includes('active')) return 'statusDot';
      if (normalized.includes('inactive')) return 'statusDot inactive';
      return 'statusDot warn';
    }

    function renderNumbers() {
      const filtered = applySort(applyFilters(applySearch(numberRows)));
      countPill.textContent = `${filtered.length} number${filtered.length === 1 ? '' : 's'}`;

      if (!filtered.length) {
        numberListEl.innerHTML = '<div class="numberTable"><div class="emptyState">No numbers match the current search and filters.</div></div>';
        return;
      }

      numberListEl.innerHTML = `
        <div class="numberTable">
          <div class="numberHeader">
            <div class="headerCell">
              <div class="headerTop">
                <button class="sortBtn" type="button" data-sort="phoneNumber">Phone Number ${sortIndicator('phoneNumber')}</button>
                ${renderFilterButton('phoneNumber')}
              </div>
            </div>
            <div class="headerCell">
              <div class="headerTop">
                <button class="sortBtn" type="button" data-sort="extension">Extension ${sortIndicator('extension')}</button>
                ${renderFilterButton('extension')}
              </div>
            </div>
            <div class="headerCell">
              <div class="headerTop">
                <button class="sortBtn" type="button" data-sort="location">Location ${sortIndicator('location')}</button>
                ${renderFilterButton('location')}
              </div>
            </div>
            <div class="headerCell">
              <div class="headerTop">
                <button class="sortBtn" type="button" data-sort="assignedTo">Assigned To ${sortIndicator('assignedTo')}</button>
                ${renderFilterButton('assignedTo')}
              </div>
            </div>
            <div class="headerCell">
              <div class="headerTop">
                <button class="sortBtn" type="button" data-sort="status">Status ${sortIndicator('status')}</button>
                ${renderFilterButton('status')}
              </div>
            </div>
            <div class="headerCell">
              <div class="headerTop">
                <button class="sortBtn" type="button" data-sort="type">Type ${sortIndicator('type')}</button>
                ${renderFilterButton('type')}
              </div>
            </div>
          </div>
          ${filtered.map(row => `
            <div class="numberRow">
              <div class="numberCell">
                <div class="stack">
                  <span class="numPrimary">${escapeHtml(row.phoneNumber || '—')}</span>
                  <div class="tags">
                    ${row.mainNumber ? '<span class="tag main">Main</span>' : ''}
                    ${row.tollFreeNumber ? '<span class="tag warn">Toll Free</span>' : ''}
                    ${row.isServiceNumber ? '<span class="tag warn">Service</span>' : ''}
                  </div>
                </div>
              </div>
              <div class="numberCell">
                <div class="stack">
                  <span class="numPrimary">${escapeHtml(row.extension || '—')}</span>
                  <span class="numSub">${escapeHtml(row.esn ? `ESN ${row.esn}` : '')}</span>
                </div>
              </div>
              <div class="numberCell">
                <span class="numPrimary locText">${escapeHtml(row.location || '—')}</span>
              </div>
              <div class="numberCell">
                <div class="stack">
                  <span class="numPrimary">${escapeHtml(row.assignedTo)}</span>
                  <span class="numSub">${escapeHtml(row.ownerType || '—')}</span>
                </div>
              </div>
              <div class="numberCell">
                <span class="${statusDotClass(row.status)}"></span>
                <span class="numPrimary">${escapeHtml(row.status)}</span>
              </div>
              <div class="numberCell">
                <div class="stack">
                  <span class="numPrimary">${escapeHtml(row.type)}</span>
                </div>
              </div>
            </div>
          `).join('')}
        </div>
      `;

      closePopover();
    }

    function loadRowsFromPayload(payload) {
      numberRows = (payload?.phoneNumbers || []).map(normalizeNumber);
      buildFilterValues(numberRows);
      renderNumbers();
    }

    async function fetchNumbers() {
      const bearer = getToken();
      refreshBtn.disabled = true;
      statusText.textContent = 'Loading numbers...';
      try {
        if (!bearer) {
          loadRowsFromPayload(samplePayload);
          sourcePill.textContent = 'Sample Data';
          statusText.textContent = 'No bearer token found. Showing the provided sample payload.';
          return;
        }

        const response = await fetch(LIVE_ENDPOINT, {
          headers: {
            'Authorization': `Bearer ${bearer}`,
            'Accept': 'application/json',
          },
        });

        if (!response.ok) {
          throw new Error(`Numbers request failed (${response.status})`);
        }

        const payload = await response.json();
        loadRowsFromPayload(payload);
        sourcePill.textContent = 'Live Data';
        statusText.textContent = '';
      } catch (error) {
        console.error(error);
        loadRowsFromPayload(samplePayload);
        sourcePill.textContent = 'Sample Data';
        statusText.textContent = `Live fetch failed. Showing the provided sample payload instead.`;
      } finally {
        refreshBtn.disabled = false;
      }
    }

    searchInput.addEventListener('input', (event) => {
      searchTerm = event.target.value.trim();
      renderNumbers();
    });

    refreshBtn.addEventListener('click', fetchNumbers);

    numberListEl.addEventListener('click', (event) => {
      if (event.target.closest('.filterPopover')) {
        event.stopPropagation();
      }

      const sortBtn = event.target.closest('.sortBtn');
      if (sortBtn) {
        const key = sortBtn.dataset.sort;
        if (sortKey === key) {
          sortDir = sortDir === 'asc' ? 'desc' : 'asc';
        } else {
          sortKey = key;
          sortDir = 'asc';
        }
        renderNumbers();
        return;
      }

      const filterBtn = event.target.closest('[data-filter-btn]');
      if (!filterBtn) return;
      const key = filterBtn.dataset.filterBtn;
      const popover = numberListEl.querySelector(`[data-filter-popover="${key}"]`);
      if (!popover) return;
      if (activePopoverState?.key === key) closePopover();
      else {
        closePopover();
        openPopover(key, filterBtn, popover);
      }
    });

    document.addEventListener('input', (event) => {
      const input = event.target;
      if (!input?.matches('[data-filter-search]')) return;
      const key = input.dataset.filterSearch;
      filterSearchTerms[key] = input.value || '';
      renderFilterPopover(key);
    });

    document.addEventListener('change', (event) => {
      const input = event.target;
      if (!input?.matches('input[data-filter-key][data-filter-value]')) return;
      setFilterValue(input.dataset.filterKey, input.dataset.filterValue, input.checked);
    });

    document.addEventListener('click', (event) => {
      if (!activePopoverState) return;
      const within = activePopoverState.popover.contains(event.target) || activePopoverState.btn.contains(event.target);
      if (!within) closePopover();
    });

    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape' && activePopoverState) closePopover();
    });

    window.addEventListener('scroll', () => {
      if (activePopoverState) positionPopover(activePopoverState.btn, activePopoverState.popover);
    }, true);

    window.addEventListener('resize', () => {
      if (activePopoverState) positionPopover(activePopoverState.btn, activePopoverState.popover);
    });

    const userNameEl = document.getElementById('userName');
    const userOrgEl = document.getElementById('userOrg');
    if (userNameEl) userNameEl.textContent = getUser() || 'Authenticated';
    if (userOrgEl) userOrgEl.textContent = getOrg() || '';

    const signOutBtn = document.getElementById('signOutBtn');
    if (signOutBtn) {
      signOutBtn.addEventListener('click', () => {
        localStorage.removeItem(cacheKeyBearer);
        localStorage.removeItem(cacheKeyOrg);
        localStorage.removeItem(cacheKeyOrgName);
        localStorage.removeItem(cacheKeyUser);
        localStorage.removeItem('authRefreshToken');
        localStorage.removeItem('authExpiresAt');
        window.location.href = '../../index.html';
      });
    }


    document.addEventListener('click', (event) => {
    });

    fetchNumbers();
  </script>
