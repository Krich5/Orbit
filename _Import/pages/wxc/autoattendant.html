  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <script>
    const KEYS = { bearer:'authBearer', org:'authOrg', orgName:'authOrgName', user:'authUserName' };
    const userNameEl = document.getElementById('userName');
    const userOrgEl = document.getElementById('userOrg');
    const signOutBtn = document.getElementById('signOutBtn');
    const status = document.getElementById('status');
    const autoAttendantStatus = document.getElementById('autoAttendantStatus');
    const tokenStatus = document.getElementById('tokenStatus');

    function updateAuthIndicators() {
      const b = localStorage.getItem(KEYS.bearer) || '';
      const org = localStorage.getItem(KEYS.orgName) || localStorage.getItem(KEYS.org) || '';
      const user = localStorage.getItem(KEYS.user) || '';
      if (userNameEl) userNameEl.textContent = b ? (user || 'Authenticated') : 'Not authenticated';
      if (userOrgEl) userOrgEl.textContent = org || '';
      tokenStatus.textContent = b ? 'Using stored OAuth bearer token' : 'No OAuth token found';
    }
    updateAuthIndicators();

    signOutBtn?.addEventListener('click', () => {
      Object.values(KEYS).forEach((key) => localStorage.removeItem(key));
      localStorage.removeItem('authOrgId');
      localStorage.removeItem('authRefreshToken');
      localStorage.removeItem('authExpiresAt');
      window.location.href = '../../index.html';
    });

    const autoAttendantsTable = document.getElementById('autoAttendantsTable');
    const sheetWrap = document.querySelector('.sheetWrap');
    const emptyState = document.getElementById('emptyState');
    const searchInput = document.getElementById('searchInput');
    const locationSelect = document.getElementById('locationSelect');
    const openAutoAttendantModalBtn = document.getElementById('openAutoAttendantModalBtn');
    const uploadAutoAttendantsCsvBtn = document.getElementById('uploadAutoAttendantsCsvBtn');
    const downloadAutoAttendantsTemplateBtn = document.getElementById('downloadAutoAttendantsTemplateBtn');
    const autoAttendantsCsvInput = document.getElementById('autoAttendantsCsvInput');

    const autoAttendantModal = document.getElementById('autoAttendantModal');
    const closeAutoAttendantModal = document.getElementById('closeAutoAttendantModal');
    const modalStatus = document.getElementById('modalStatus');

    const locationSelectModal = document.getElementById('locationSelectModal');
    const nameInput = document.getElementById('nameInput');
    const phoneInput = document.getElementById('phoneInput');
    const extensionInput = document.getElementById('extensionInput');
    const languageInput = document.getElementById('languageInput');
    const businessScheduleInput = document.getElementById('businessScheduleInput');
    const holidayScheduleInput = document.getElementById('holidayScheduleInput');
    const timeZoneInput = document.getElementById('timeZoneInput');
    const extensionDialingInput = document.getElementById('extensionDialingInput');
    const nameDialingInput = document.getElementById('nameDialingInput');
    const businessGreetingInput = document.getElementById('businessGreetingInput');
    const afterGreetingInput = document.getElementById('afterGreetingInput');
    const businessKeysInput = document.getElementById('businessKeysInput');
    const afterKeysInput = document.getElementById('afterKeysInput');
    const extensionEnabledInput = document.getElementById('extensionEnabledInput');
    const createBtn = document.getElementById('createBtn');
    const clearBtn = document.getElementById('clearBtn');

    const BASE_URL = 'https://webexapis.com';
    let autoAttendants = [];
    let locations = [];

    function withOrgParam(url) {
      const loginMethod = localStorage.getItem('authLoginMethod') || '';
      const orgId = localStorage.getItem(KEYS.org) || '';
      if (loginMethod === 'token' && orgId && !url.includes('orgId=')) {
        return url + (url.includes('?') ? '&' : '?') + `orgId=${encodeURIComponent(orgId)}`;
      }
      return url;
    }

    async function loadLocations() {
      const token = localStorage.getItem(KEYS.bearer) || '';
      if (!token) {
        locationSelect.innerHTML = '<option value="">Authenticate to load locations</option>';
        locationSelectModal.innerHTML = '<option value="">Authenticate to load locations</option>';
        return;
      }
      locationSelect.innerHTML = '<option value="">Loading locations…</option>';
      locationSelectModal.innerHTML = '<option value="">Loading locations…</option>';
      try {
        const res = await fetch(withOrgParam(`${BASE_URL}/v1/locations?max=500`), {
          headers: { Authorization: `Bearer ${token}` }
        });
        const data = await res.json();
        locations = data.items || data.locations || data || [];
        if (!Array.isArray(locations)) locations = [];
        const options = ['<option value="">Select location</option>'].concat(
          locations.map(loc => `<option value="${loc.id}">${loc.name || loc.id}</option>`)
        );
        locationSelect.innerHTML = options.join('');
        locationSelectModal.innerHTML = options.join('');
      } catch {
        locationSelect.innerHTML = '<option value="">Failed to load locations</option>';
        locationSelectModal.innerHTML = '<option value="">Failed to load locations</option>';
      }
    }

    function renderTable() {
      const term = (searchInput.value || '').toLowerCase();
      const filtered = autoAttendants.filter((item) => {
        const values = [item.name, item.phoneNumber, item.extension, item.languageCode, item.timeZone, item.id]
          .filter(Boolean)
          .join(' ')
          .toLowerCase();
        return values.includes(term);
      });

      if (!filtered.length) {
        autoAttendantsTable.innerHTML = '';
        autoAttendantsTable.style.display = 'none';
        if (sheetWrap) sheetWrap.style.display = 'none';
        emptyState.style.display = 'block';
        return;
      }

      emptyState.style.display = 'none';
      autoAttendantsTable.style.display = 'table';
      if (sheetWrap) sheetWrap.style.display = 'block';
      autoAttendantsTable.innerHTML = `
        <thead>
          <tr>
            <th>Name</th>
            <th>Phone Number</th>
            <th>Extension</th>
            <th>Language</th>
            <th>Time Zone</th>
          </tr>
        </thead>
        <tbody>
          ${filtered.map(item => `
            <tr>
              <td>${item.name || '-'}</td>
              <td>${item.phoneNumber || '-'}</td>
              <td>${item.extension || '-'}</td>
              <td>${item.languageCode || item.language || item.languageName || '-'}</td>
              <td>${item.timeZone || item.timeZoneId || item.timeZoneName || '-'}</td>
            </tr>
          `).join('')}
        </tbody>
      `;
    }

    async function loadAutoAttendants() {
      const token = localStorage.getItem(KEYS.bearer) || '';
      const locationId = locationSelect.value;
      if (!token) {
        status.textContent = 'Bearer token required. Authenticate to continue.';
        return;
      }
      if (!locationId) {
        status.textContent = 'Select a location to load auto attendants.';
        return;
      }

      status.textContent = 'Loading auto attendants...';
      autoAttendantStatus.textContent = '';
      emptyState.style.display = 'none';
      autoAttendantsTable.innerHTML = '';

      try {
        const res = await fetch(`https://webexapis.com/v1/telephony/config/autoAttendants?locationId=${encodeURIComponent(locationId)}`, {
          headers: { Authorization: `Bearer ${token}` }
        });
        const text = await res.text();
        let data;
        try { data = JSON.parse(text); } catch { data = text; }
        autoAttendants = (data && (data.autoAttendants || data.items)) || (Array.isArray(data) ? data : []);
        if (!Array.isArray(autoAttendants)) autoAttendants = [];
        renderTable();
        if (res.ok) {
          status.textContent = `Loaded ${autoAttendants.length} auto attendant(s).`;
        } else {
          const msg = typeof data === 'string' ? data : JSON.stringify(data);
          status.textContent = `Error (${res.status}) loading list.`;
          autoAttendantStatus.textContent = msg;
        }
      } catch {
        status.textContent = 'Failed to load auto attendants.';
      }
    }

    locationSelect.addEventListener('change', () => {
      if (!locationSelect.value) {
        autoAttendantsTable.innerHTML = '';
        autoAttendantsTable.style.display = 'none';
        if (sheetWrap) sheetWrap.style.display = 'none';
        emptyState.style.display = 'block';
        status.textContent = 'Select a location to load auto attendants.';
        return;
      }
      loadAutoAttendants();
    });
    searchInput.addEventListener('input', renderTable);

    function openModal() {
      autoAttendantModal.classList.add('open');
      modalStatus.textContent = '';
      locationSelectModal.value = locationSelect.value || '';
    }

    function closeModal() {
      autoAttendantModal.classList.remove('open');
    }

    openAutoAttendantModalBtn.addEventListener('click', openModal);
    closeAutoAttendantModal.addEventListener('click', closeModal);
    autoAttendantModal.addEventListener('click', (event) => {
      if (event.target === autoAttendantModal) closeModal();
    });

    function parseKeys(value, label) {
      if (!value.trim()) return {};
      try {
        return JSON.parse(value);
      } catch {
        throw new Error(`${label} must be valid JSON.`);
      }
    }

    function buildPayload(row) {
      const payload = {
        name: String(row.name || '').trim(),
        phoneNumber: String(row.phoneNumber || '').trim() || undefined,
        extension: String(row.extension || '').trim() || undefined,
        languageCode: String(row.languageCode || '').trim() || undefined,
        businessSchedule: String(row.businessSchedule || '').trim(),
        holidaySchedule: String(row.holidaySchedule || '').trim() || undefined,
        extensionDialing: String(row.extensionDialing || 'ENTERPRISE').trim(),
        nameDialing: String(row.nameDialing || 'ENTERPRISE').trim(),
        timeZone: String(row.timeZone || '').trim() || undefined,
        businessHoursMenu: {
          greeting: String(row.businessGreeting || 'DEFAULT').trim(),
          extensionEnabled: String(row.extensionEnabled || 'true').toLowerCase() === 'true',
          keyConfigurations: row.businessKeysJson ? parseKeys(row.businessKeysJson, 'Business hours key configurations') : {}
        },
        afterHoursMenu: {
          greeting: String(row.afterGreeting || 'DEFAULT').trim(),
          keyConfigurations: row.afterKeysJson ? parseKeys(row.afterKeysJson, 'After hours key configurations') : {}
        }
      };
      Object.keys(payload).forEach((key) => {
        if (payload[key] === undefined || payload[key] === '') delete payload[key];
      });
      return payload;
    }

    clearBtn.addEventListener('click', () => {
      locationSelectModal.value = locationSelect.value || '';
      nameInput.value = '';
      phoneInput.value = '';
      extensionInput.value = '';
      languageInput.value = 'en_US';
      businessScheduleInput.value = '';
      holidayScheduleInput.value = '';
      timeZoneInput.value = '';
      extensionDialingInput.value = 'ENTERPRISE';
      nameDialingInput.value = 'ENTERPRISE';
      businessGreetingInput.value = 'DEFAULT';
      afterGreetingInput.value = 'DEFAULT';
      businessKeysInput.value = '';
      afterKeysInput.value = '';
      extensionEnabledInput.checked = true;
      modalStatus.textContent = '';
    });

    createBtn.addEventListener('click', async () => {
      const token = localStorage.getItem(KEYS.bearer) || '';
      const locationId = locationSelectModal.value;
      const name = nameInput.value.trim();

      if (!token) {
        modalStatus.textContent = 'Bearer token required. Authenticate to continue.';
        return;
      }
      if (!locationId || !name) {
        modalStatus.textContent = 'Location and Name are required.';
        return;
      }
      if (!phoneInput.value.trim() && !extensionInput.value.trim()) {
        modalStatus.textContent = 'Either phone number or extension is required.';
        return;
      }

      const row = {
        name: nameInput.value,
        phoneNumber: phoneInput.value,
        extension: extensionInput.value,
        languageCode: languageInput.value,
        businessSchedule: businessScheduleInput.value,
        holidaySchedule: holidayScheduleInput.value,
        extensionDialing: extensionDialingInput.value,
        nameDialing: nameDialingInput.value,
        timeZone: timeZoneInput.value,
        businessGreeting: businessGreetingInput.value,
        afterGreeting: afterGreetingInput.value,
        extensionEnabled: extensionEnabledInput.checked ? 'true' : 'false',
        businessKeysJson: businessKeysInput.value,
        afterKeysJson: afterKeysInput.value
      };

      let payload;
      try {
        payload = buildPayload(row);
      } catch (err) {
        modalStatus.textContent = err.message || 'Check input values.';
        return;
      }

      modalStatus.textContent = 'Creating auto attendant...';

      try {
        const res = await fetch(`https://webexapis.com/v1/telephony/config/locations/${encodeURIComponent(locationId)}/autoAttendants`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            Accept: 'application/json',
            Authorization: `Bearer ${token}`
          },
          body: JSON.stringify(payload)
        });
        const text = await res.text();
        let parsed;
        try { parsed = JSON.parse(text); } catch { parsed = text; }
        modalStatus.textContent = res.ok ? 'Auto attendant created.' : `Error (${res.status}) creating auto attendant.`;
        autoAttendantStatus.textContent = typeof parsed === 'string' ? parsed : JSON.stringify(parsed);
        if (res.ok) {
          closeModal();
          loadAutoAttendants();
        }
      } catch {
        modalStatus.textContent = 'Request failed. Check console for details.';
      }
    });

    function downloadCsv(filename, csvText) {
      const blob = new Blob([csvText], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = filename;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(url);
    }

    function buildTemplateRow() {
      return {
        locationId: '',
        name: 'Main Line AA',
        phoneNumber: '+13866314611',
        extension: '1234',
        languageCode: 'en_US',
        businessSchedule: 'Hours',
        holidaySchedule: 'Holiday',
        extensionDialing: 'ENTERPRISE',
        nameDialing: 'ENTERPRISE',
        timeZone: 'America/Denver',
        businessGreeting: 'DEFAULT',
        afterGreeting: 'DEFAULT',
        extensionEnabled: 'true',
        businessKeysJson: '{"1":{"action":"TRANSFER_WITHOUT_PROMPT","value":"+19705550006"}}',
        afterKeysJson: '{}'
      };
    }

    downloadAutoAttendantsTemplateBtn.addEventListener('click', () => {
      const headers = Object.keys(buildTemplateRow());
      const csv = Papa.unparse([buildTemplateRow()], { columns: headers });
      downloadCsv('auto_attendant_template.csv', csv);
    });

    uploadAutoAttendantsCsvBtn.addEventListener('click', () => {
      autoAttendantsCsvInput.click();
    });

    autoAttendantsCsvInput.addEventListener('change', () => {
      const file = autoAttendantsCsvInput.files?.[0];
      if (!file) return;
      Papa.parse(file, {
        header: true,
        skipEmptyLines: true,
        complete: async (results) => {
          const rows = results.data || [];
          if (!rows.length) {
            status.textContent = 'CSV has no rows.';
            return;
          }
          await runBulkCreate(rows);
        },
        error: () => {
          status.textContent = 'Failed to parse CSV.';
        }
      });
      autoAttendantsCsvInput.value = '';
    });

    async function runBulkCreate(rows) {
      const token = localStorage.getItem(KEYS.bearer) || '';
      if (!token) {
        status.textContent = 'Bearer token required. Authenticate to continue.';
        return;
      }
      let successCount = 0;
      let failCount = 0;
      status.textContent = `Starting bulk create (${rows.length} rows)...`;
      for (let i = 0; i < rows.length; i++) {
        const row = rows[i] || {};
        const locationId = String(row.locationId || '').trim() || locationSelect.value;
        const name = String(row.name || '').trim();
        const phoneNumber = String(row.phoneNumber || '').trim();
        const extension = String(row.extension || '').trim();
        const businessSchedule = String(row.businessSchedule || '').trim();

        if (!locationId || !name || (!phoneNumber && !extension) || !businessSchedule) {
          failCount += 1;
          status.textContent = `Row ${i + 1}: missing required fields. (${successCount} success, ${failCount} failed)`;
          continue;
        }

        let payload;
        try {
          payload = buildPayload({
            ...row,
            locationId,
            name,
            phoneNumber,
            extension,
            businessSchedule
          });
        } catch (err) {
          failCount += 1;
          status.textContent = `Row ${i + 1}: ${err.message || 'invalid JSON'}. (${successCount} success, ${failCount} failed)`;
          continue;
        }

        try {
          const res = await fetch(`https://webexapis.com/v1/telephony/config/locations/${encodeURIComponent(locationId)}/autoAttendants`, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              Accept: 'application/json',
              Authorization: `Bearer ${token}`
            },
            body: JSON.stringify(payload)
          });
          if (res.ok) successCount += 1;
          else failCount += 1;
        } catch {
          failCount += 1;
        }
        status.textContent = `Processed ${i + 1}/${rows.length} (${successCount} success, ${failCount} failed)`;
      }
      status.textContent = `Bulk create complete. ${successCount} success, ${failCount} failed.`;
      loadAutoAttendants();
    }


    document.addEventListener('click', (event) => {
    });

    document.addEventListener('keydown', (event) => {
    });

    loadLocations();
  </script>
</body>
