<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Authenticating...</title>
  <meta name="color-scheme" content="light">
  <link rel="stylesheet" href="assets/css/theme.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      font-family: "Montserrat", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Helvetica, Arial;
      background: var(--bg);
      color: var(--fg);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
  </style>
</head>
<body class="dark-mode">
  <script>if (localStorage.getItem("tpRailExpanded") === "true") document.body.classList.add("tp-rail-expanded");</script>
  <div style="text-align:center;padding:24px;">
    <div style="margin-bottom:12px;">Completing sign-in…</div>
    <div style="color:var(--muted);font-size:14px;">You can close this window if it does not close automatically.</div>
  </div>
  <script>
    (function() {
      const allowedOrigin = window.location.origin;
      const params = new URLSearchParams(window.location.search);
      const code = params.get('code');
      const error = params.get('error');
      const state = params.get('state');
      const payload = { source: 'api-popup', code, error, state };
      if (window.opener && (code || error)) {
        try {
          window.opener.postMessage(payload, allowedOrigin);
        } catch (e) {
          console.warn('postMessage to opener failed', e);
        }
        setTimeout(() => window.close(), 50);
      } else {
        // Fallback to full callback flow
        window.location.href = 'callback.html' + window.location.search;
      }
    })();
  </script>


  </body>
</html>
